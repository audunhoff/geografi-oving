transport, kraftforsyning, vann og digitale nett. Den påvirker kostnader, tilgang til ressurser og hvor pålitelig en virksomhet kan drives.", "example": "En produsent som sender tunge varer med skip, kan ha nytte av å ligge nær en egnet havn."}, {"id": "globalisering-kort-06", "term": "Multinasjonalt selskap", "prompt": "Hva kjennetegner et multinasjonalt selskap?", "answer": "Et multinasjonalt selskap eier eller kontrollerer virksomhet i flere land. Selskapets valg om investeringer og lokalisering kan påvirke arbeidsplasser, ressursbruk og lokale inntekter flere steder.", "example": "Et konsern som har fabrikker i flere land og et felles hovedkontor, kan være multinasjonalt."}, {"id": "globalisering-kort-07", "term": "Outsourcing", "prompt": "Hva er outsourcing, og må det skje til utlandet?", "answer": "Outsourcing betyr å la en annen virksomhet utføre en aktivitet selskapet ellers kunne gjort selv. Leverandøren kan ligge i samme land eller i utlandet; begrepet er derfor ikke det samme som å flytte produksjon over en landegrense.", "example": "En butikkjede outsourcer renholdet når den kjøper tjenesten fra et eget renholdsfirma."}, {"id": "globalisering-kort-08", "term": "Målkonflikt", "prompt": "Hvordan kan en næringsetablering skape en målkonflikt?", "answer": "En målkonflikt oppstår når et tiltak fremmer ett mål samtidig som det gjør et annet vanskeligere å nå. Ved næringsutvikling kan økonomiske gevinster komme i konflikt med naturhensyn eller andre gruppers arealbruk.", "example": "Et nytt industriområde kan gi arbeidsplasser, men samtidig bygge ned matjord."}, {"id": "globalisering-kort-09", "term": "Råvare- og energiorientering", "prompt": "Når blir nærhet til råvarer eller energi særlig viktig?", "answer": "Virksomheter kan ønske nærhet til råvarer når råvarene er tunge, ferske eller kostbare å transportere. Kraftkrevende produksjon kan legge stor vekt på pris, kapasitet og stabilitet i energiforsyningen.", "example": "Et sagbruk kan ha nytte av nærhet til tømmer, mens et aluminiumsverk trenger mye elektrisk kraft."}, {"id": "globalisering-kort-10", "term": "Markedsorientering", "prompt": "Hvorfor kan nærhet til kunder være en avgjørende lokaliseringsfaktor?", "answer": "Nærhet til markedet kan gi enkel kundetilgang, rask levering og lavere transportkostnader for ferdige varer. Betydningen avhenger av produktet, tjenesten og hvordan kundene kjøper.", "example": "En frisørsalong trenger vanligvis å ligge et sted kundene lett kan komme til."}, {"id": "globalisering-kort-11", "term": "Kompetanse og næringsmiljø", "prompt": "Hvorfor samler beslektede virksomheter seg ofte på samme sted?", "answer": "Et næringsmiljø kan gi tilgang til spesialisert arbeidskraft, leverandører, forskning og samarbeid. Slike fordeler kan trekke nye virksomheter til området selv om enkelte kostnader er høyere.", "example": "En teknologibedrift kan velge å ligge nær et universitet for å rekruttere og samarbeide om utvikling."}, {"id": "globalisering-kort-12", "term": "Sårbar forsyningskjede", "prompt": "Hva kan gjøre en forsyningskjede sårbar?", "answer": "En forsyningskjede kan bli sårbar hvis den er avhengig av få leverandører, bestemte transportveier eller en ustabil ressursforsyning. Flere leverandører og beredskapslagre kan redusere enkelte risikoer, men gir også kostnader.", "example": "En fabrikk kan måtte stanse dersom en nødvendig komponent bare leveres fra ett anlegg som blir satt ut av drift."}]}, {"id": "metode", "title": "Kart, kilder og feltarbeid", "subtitle": "Undersøk geografiske forhold og begrunn hva du kan konkludere med.", "ndla": "https://ndla.no/nb/f/geografi/b6b445755675", "concepts": ["problemstilling", "observasjon", "utvalg", "målestokk", "kartlag", "sammenlignbarhet", "kildekritikk", "feilkilde"], "goals": ["Gjennomføre og presentere en avgrenset geografisk undersøkelse.", "Lese kart, bilder og statistikk med oppmerksomhet på målestokk og datagrunnlag.", "Skille mellom observasjon, tolkning og konklusjon og vurdere feilkilder."], "tasks": [{"id": "metode-1", "title": "Regnvann i nærmiljøet", "prompt": "Gjennomfør en liten feltundersøkelse av et tilgjengelig område: Hvordan kan overflatene og terrenget påvirke hvor regnvann renner? Presenter problemstilling, metode, observasjoner og tolkninger, og vurder hva undersøkelsen kan og ikke kan vise.", "focus": ["Avgrenset område og tydelig problemstilling", "Kart, bilder og systematiske observasjoner", "Tette og gjennomtrengelige overflater og helning", "Skille mellom observert vann og antatt avrenning", "Værforhold, utvalg, feilkilder og forbedring"], "questions": [{"q": "Hva skiller en observasjon fra en tolkning i feltarbeidet ditt?", "cue": "Det du registrerer direkte, sammenlignet med forklaringen du foreslår.", "level": "Forklare"}, {"q": "Hvorfor er en tydelig problemstilling viktig før du går ut?", "cue": "Den styrer hvilke steder, variabler og metoder som er relevante.", "level": "Forklare"}, {"q": "Vis ett bilde eller et kartutsnitt: Hva registrerte du, og hvordan støtter det forklaringen din?", "cue": "Sted, tidspunkt, helning, overflate og eventuell avrenning; beskriv før du forklarer.", "level": "Anvende"}, {"q": "Kan et besøk i tørt vær vise hvordan området håndterer kraftig regn?", "cue": "Indikasjoner er noe annet enn direkte målinger; suppler med flere tidspunkt eller data.", "level": "Drøfte"}, {"q": "Hvordan ville du forbedret undersøkelsen med mer tid?", "cue": "Flere observasjoner, sammenlignbare punkter, nedbørsdata og kontroll av antakelser.", "level": "Drøfte"}], "bridge": {"q": "Hvilke klimatilpasningstiltak kan være relevante ut fra funnene dine?", "cue": "Vegetasjon, gjennomtrengelige flater, regnbed og flomveier; undersøk lokale behov før tiltak."}}, {"id": "metode-2", "title": "Les et landskap med kart", "prompt": "Velg et norsk område og bruk et topografisk kart sammen med et flyfoto eller landskapsbilde. Beskriv terreng, vann og arealbruk, og forklar hvordan kartene kan brukes til å undersøke forholdet mellom natur og samfunn.", "focus": ["Målestokk, tegnforklaring og høydekurver", "Terrengformer og vannets bevegelser", "Bosetting, infrastruktur og ressursbruk", "Sammenligning av kart og bilde", "Usikkerhet og behov for andre datakilder"], "questions": [{"q": "Hva forteller målestokken deg, og hvorfor betyr den noe for analysen?", "cue": "Forholdet mellom kart og virkelighet; detaljnivå og avstander.", "level": "Forklare"}, {"q": "Hvordan bruker du høydekurver til å lese terrenget?", "cue": "Høyde, form og avstand mellom kurver; vurder helning og dalfører.", "level": "Forklare"}, {"q": "Pek ut et sted der terrenget kan ha påvirket bosetting eller veiutbygging.", "cue": "Vis til konkrete trekk i kartet; sammenlign med bilde og vurder alternative forklaringer.", "level": "Anvende"}, {"q": "Er et kart nok til å avgjøre om et sted er trygt for ny bebyggelse?", "cue": "Skala, oppdatering, farekart, grunnforhold og behov for faglige undersøkelser.", "level": "Drøfte"}, {"q": "Hvordan kan valg av kartlag påvirke inntrykket av et område?", "cue": "Hva vises eller utelates? Temavalg, symboler, avgrensning og datagrunnlag.", "level": "Drøfte"}], "bridge": {"q": "Hvilke spor etter indre og ytre krefter kan du undersøke i området?", "cue": "Landformer og berggrunn; vurder hva kartet viser, og hva som krever andre kilder."}}, {"id": "metode-3", "title": "Når kilder gir ulike inntrykk", "prompt": "Finn to kilder som belyser den samme geografiske problemstillingen, for eksempel levekår, arealbruk eller klima. Sammenlign datagrunnlag, framstilling og formål, og vurder hvilke konklusjoner kildene gir grunnlag for.", "focus": ["Avsender, formål og dokumentasjon", "Årstall, geografisk nivå og definisjoner", "Absolutte tall og relative størrelser", "Akser, kartinndeling og utvalg", "Forskjell mellom sammenheng og årsak"], "questions": [{"q": "Hva undersøker du for å vurdere om en kilde passer til problemstillingen?", "cue": "Relevans, datainnsamling, avsender, tidspunkt og dokumentasjon.", "level": "Forklare"}, {"q": "Hva er forskjellen på absolutte tall og tall per innbygger?", "cue": "Samlet mengde sammenlignet med en størrelse justert for folketall; ulike spørsmål.", "level": "Forklare"}, {"q": "Vis én konkret forskjell i framstillingen mellom kildene dine.", "cue": "Akser, periode, indikator, arealinndeling eller utvalg; forklar virkningen for leseren.", "level": "Anvende"}, {"q": "Betyr ulike resultater nødvendigvis at én kilde er feil?", "cue": "Ulike definisjoner, tidspunkt, metoder og geografiske nivåer kan forklare forskjeller.", "level": "Drøfte"}, {"q": "Hvorfor er det ikke nok at to forhold endrer seg samtidig for å påvise en årsak?", "cue": "Andre forklaringer, tidsrekkefølge, mekanismer og behov for mer dokumentasjon.", "level": "Drøfte"}], "bridge": {"q": "Hvordan kan landsgjennomsnitt skjule forskjeller i levekår?", "cue": "Regioner, inntektsgrupper, kjønn og andre forskjeller; sammenlign flere nivåer."}}], "cards": [{"id": "metode-kort-01", "term": "Problemstilling", "prompt": "Hva kjennetegner en god problemstilling i et lite feltarbeid?", "answer": "En god problemstilling er avgrenset og mulig å undersøke med tilgjengelig tid og metode. Den gjør det tydelig hva du skal finne ut, og hjelper deg å velge relevante observasjoner.", "example": "«Hvordan varierer andelen tette flater langs denne gata?» kan undersøkes mer direkte enn «Er byen bærekraftig?»."}, {"id": "metode-kort-02", "term": "Observasjon", "prompt": "Hva er en observasjon i geografisk feltarbeid?", "answer": "En observasjon er noe du registrerer direkte, for eksempel en overflate, en terrengform eller en vannansamling. Sted, tidspunkt og en tydelig registreringsmåte gjør observasjonen lettere å forstå og etterprøve.", "example": "«Det står vann på asfalten ved sluket» er en observasjon du kan dokumentere med bilde og sted."}, {"id": "metode-kort-03", "term": "Utvalg", "prompt": "Hvorfor påvirker utvalget hva du kan konkludere med?", "answer": "Utvalget er de stedene, tidspunktene eller enhetene du faktisk undersøker. Hvis utvalget bare dekker en spesiell del av området, kan du ikke uten videre generalisere funnene til hele området.", "example": "Undersøker du bare en asfaltert parkeringsplass, sier funnene lite om overflatene i byens parker."}, {"id": "metode-kort-04", "term": "Målestokk", "prompt": "Hva forteller målestokken på et kart?", "answer": "Målestokken viser forholdet mellom en avstand på kartet og den tilsvarende avstanden i virkeligheten. Den påvirker både avstandsberegninger og hvor mye detalj kartet kan vise.", "example": "Et oversiktskart over hele Norge egner seg dårlig til å undersøke nøyaktig hvor et lokalt sluk ligger."}, {"id": "metode-kort-05", "term": "Kartlag", "prompt": "Hvordan kan kartlag hjelpe deg å undersøke en geografisk sammenheng?", "answer": "Et kartlag viser en bestemt type informasjon, som terreng, bebyggelse eller arealbruk. Ved å sammenligne lag kan du oppdage romlige mønstre, men mønstrene dokumenterer ikke automatisk en årsakssammenheng.", "example": "Terreng og bebyggelse kan vises sammen for å undersøke hvor hus ligger i forhold til et dalføre."}, {"id": "metode-kort-06", "term": "Sammenlignbarhet", "prompt": "Hva må du kontrollere før du sammenligner to datasett?", "answer": "Kontroller blant annet definisjoner, enheter, tidsperiode, geografisk avgrensning og innsamlingsmetode. Forskjeller i resultat kan skyldes ulik måling eller avgrensning fremfor en reell endring.", "example": "Et folketall for en kommune kan ikke sammenlignes direkte med et annet tall som bare gjelder tettstedet."}, {"id": "metode-kort-07", "term": "Kildekritikk", "prompt": "Hvordan vurderer du om en kilde er egnet?", "answer": "Undersøk hvem som står bak, formålet, tidspunktet, metoden og dokumentasjonen. En kilde må både være pålitelig og relevant for akkurat det spørsmålet du vil besvare.", "example": "En gammel kommuneplan kan vise tidligere mål for et område, men ikke dokumentere dagens faktiske arealbruk."}, {"id": "metode-kort-08", "term": "Feilkilde", "prompt": "Hva er en feilkilde, og hvordan bør du omtale den?", "answer": "En feilkilde er et forhold som kan påvirke dataene eller tolkningen slik at resultatet blir misvisende. Forklar hvordan den kan påvirke konklusjonen, og foreslå hvordan undersøkelsen kan forbedres.", "example": "Hvis du teller trafikk bare utenfor rushtiden, kan du undervurdere belastningen gjennom dagen."}, {"id": "metode-kort-09", "term": "Observasjon og tolkning", "prompt": "Hva skiller en observasjon fra en tolkning?", "answer": "Observasjonen er det du registrerer, mens tolkningen er forklaringen eller betydningen du tillegger det. En tolkning bør begrunnes med observasjoner og relevant fagkunnskap, og alternative forklaringer bør vurderes.", "example": "Du observerer vann ved et sluk; at sluket er tett, er en forklaring som må undersøkes nærmere."}, {"id": "metode-kort-10", "term": "Kvantitative og kvalitative data", "prompt": "Hva er forskjellen på kvantitative og kvalitative data?", "answer": "Kvantitative data uttrykkes som tall, mens kvalitative data beskriver egenskaper, erfaringer eller innhold. De kan utfylle hverandre, men må samles inn på en måte som passer problemstillingen.", "example": "Antall sykler ved en stasjon er kvantitative data, mens intervjuer om hvorfor folk sykler gir kvalitative data."}, {"id": "metode-kort-11", "term": "Geografisk nivå", "prompt": "Hvorfor bør du undersøke et spørsmål på flere geografiske nivåer?", "answer": "Lokale, regionale og globale perspektiver kan vise ulike sider av samme forhold. Et gjennomsnitt på et stort nivå kan skjule viktige forskjeller på mindre steder.", "example": "Et landsgjennomsnitt for inntekt kan skjule store forskjeller mellom bydeler."}, {"id": "metode-kort-12", "term": "Sammenheng og årsak", "prompt": "Hvorfor er ikke et mønster alene bevis for en årsak?", "answer": "At to forhold varierer sammen, viser ikke nødvendigvis at det ene skaper det andre. Du må undersøke mulige mekanismer, tidsrekkefølge og andre faktorer som kan påvirke begge.", "example": "At mange butikker ligger ved en vei, beviser ikke alene at veien var årsaken til etableringene."}]}, {"id": "katastrofe", "title": "Natur- og miljøkatastrofer", "subtitle": "Knytt en dokumentert hendelse til årsaker, sårbarhet og tiltak.", "ndla": "https://ndla.no/nb/f/geografi/b6b445755675", "concepts": ["naturfare", "eksponering", "sårbarhet", "risiko", "beredskap", "forebygging", "miljøkatastrofe", "kildekritikk"], "goals": ["Undersøke en aktuell natur- eller miljøkatastrofe med daterte kilder.", "Skille hendelsens fysiske årsaker fra samfunnets eksponering og sårbarhet.", "Drøfte konsekvenser og tiltak for mennesker, samfunn og natur."], "tasks": [{"id": "katastrofe-1", "title": "Fra naturhendelse til katastrofe", "prompt": "Velg en aktuell naturkatastrofe og dokumenter sted, tidspunkt og hendelsesforløp med daterte kilder. Forklar de fysiske årsakene og drøft hvorfor hendelsen fikk de konsekvensene den fikk for mennesker, samfunn og natur.", "focus": ["Verifisert sted, tidspunkt og kilder", "Fysiske prosesser bak hendelsen", "Eksponering, sårbarhet og beredskap", "Kortsiktige og langsiktige konsekvenser", "Usikkerhet og skille mellom dokumentasjon og antakelser"], "questions": [{"q": "Hva er forskjellen på en naturfare og en katastrofe?", "cue": "En mulig skadelig prosess sammenlignet med alvorlige følger i et rammet samfunn.", "level": "Forklare"}, {"q": "Hva mener vi med eksponering og sårbarhet?", "cue": "Hvem og hva som befinner seg i fareområdet; hvor utsatt de er og evnen til å håndtere hendelsen.", "level": "Forklare"}, {"q": "Hvilke konkrete forhold i området bidro til skadeomfanget?", "cue": "Knytt dokumenterte forhold ved bosetting, infrastruktur og beredskap til hendelsen.", "level": "Anvende"}, {"q": "Hvordan kunne lignende fysiske hendelser fått andre følger et annet sted?", "cue": "Byggeskikk, varsling, økonomi, helsetjenester, befolkning og topografi.", "level": "Drøfte"}, {"q": "Hvilke opplysninger om katastrofen er fortsatt usikre?", "cue": "Foreløpige skadeanslag, endrede tall, manglende data og forskjeller mellom kilder.", "level": "Drøfte"}], "bridge": {"q": "Hvordan kan hendelsen få betydning for framtidig arealplanlegging?", "cue": "Fareområder, lokalisering, sikring, flytting og hensyn til eksisterende bebyggelse."}}, {"id": "katastrofe-2", "title": "Forebygge flom, skred eller ekstremvær", "prompt": "Velg en aktuell, dokumentert flom-, skred- eller ekstremværhendelse. Forklar hendelsen og vurder hvordan arealbruk, varsling og andre tiltak kan redusere skade ved framtidige hendelser.", "focus": ["Hendelsestype og dokumenterte årsaker", "Naturlige forhold og menneskelige inngrep", "Forebygging, varsling og beredskap", "Tiltakenes kostnader og mulige bivirkninger", "Presis omtale av eventuell sammenheng med klimaendringer"], "questions": [{"q": "Hvilke fysiske prosesser kan utløse denne hendelsestypen?", "cue": "Velg det som passer: nedbør, snøsmelting, vannmetning, terreng, vind eller andre forhold.", "level": "Forklare"}, {"q": "Hva er forskjellen på å forebygge skade og å ha beredskap?", "cue": "Redusere risiko i forkant sammenlignet med å kunne varsle, håndtere og begrense følger.", "level": "Forklare"}, {"q": "Hvilket tiltak ville du undersøkt først i det rammede området?", "cue": "Begrunn med lokale forhold og hvem som er utsatt; bruk kart og faglige kilder.", "level": "Anvende"}, {"q": "Hvorfor kan et sikringstiltak ett sted skape utfordringer et annet sted?", "cue": "Endret vannføring, flytting av risiko, naturinngrep, vedlikehold og kostnader.", "level": "Drøfte"}, {"q": "Hva kreves for å si noe om klimaendringenes rolle i akkurat denne hendelsen?", "cue": "Skill utvikling i risiko fra årsaken til én hendelse; bruk relevant faglig dokumentasjon og oppgi usikkerhet.", "level": "Drøfte"}], "bridge": {"q": "Hvordan kan et lokalt feltarbeid bidra til å undersøke forhold som påvirker avrenning?", "cue": "Systematiske observasjoner av overflater og terreng; vær tydelig på metodens begrensninger."}}, {"id": "katastrofe-3", "title": "Når menneskelig aktivitet skader miljøet", "prompt": "Velg en aktuell, dokumentert miljøkatastrofe, for eksempel et større utslipp eller en alvorlig forurensningshendelse. Undersøk årsaker og konsekvenser, og drøft forebygging, opprydding og fordeling av ansvar.", "focus": ["Dokumentert hendelse og kildegrunnlag", "Direkte årsaker og bakenforliggende forhold", "Spredning og virkninger i naturen", "Konsekvenser for mennesker og næringer", "Forebygging, opprydding og ulike aktørers ansvar"], "questions": [{"q": "Hva gjør hendelsen du valgte til en miljøkatastrofe?", "cue": "Omfang, alvorlighet, varighet og berørte økosystemer og samfunn; begrunn med kilder.", "level": "Forklare"}, {"q": "Hva er forskjellen på en direkte årsak og en bakenforliggende årsak?", "cue": "Den utløsende hendelsen sammenlignet med for eksempel rutiner, vedlikehold eller arealbruk.", "level": "Forklare"}, {"q": "Hvordan kan kart hjelpe deg å undersøke hvem og hva som ble rammet?", "cue": "Utslippssted, vann- eller lufttransport, bosetting, økosystemer og næringsvirksomhet.", "level": "Anvende"}, {"q": "Hvordan bør ulike tiltak for opprydding vurderes?", "cue": "Effekt, tid, kostnad, tilgang og mulig skade ved selve tiltaket.", "level": "Drøfte"}, {"q": "Hvem bør bære kostnadene, og hva trenger du å vite før du vurderer ansvar?", "cue": "Aktører, dokumentert hendelsesforløp, gjeldende regler og hvem som får belastningene.", "level": "Drøfte"}], "bridge": {"q": "Hvordan kan global etterspørsel etter ressurser påvirke risikoen for miljøskade lokalt?", "cue": "Produksjonsomfang, utvinningsmetoder, kontroll, teknologi og avhengighet av inntekter."}}], "cards": [{"id": "katastrofe-kort-01", "term": "Naturfare", "prompt": "Hva er en naturfare?", "answer": "En naturfare er en naturprosess eller hendelse som kan føre til skade, for eksempel flom, skred eller jordskjelv. Om hendelsen gir store samfunnskonsekvenser, avhenger også av hvem og hva som er utsatt.", "example": "Et skred i et ubebodd område kan være en stor fysisk hendelse uten å bli en katastrofe for et lokalsamfunn."}, {"id": "katastrofe-kort-02", "term": "Eksponering", "prompt": "Hva betyr eksponering når vi undersøker katastroferisiko?", "answer": "Eksponering handler om mennesker, bygninger, naturverdier og aktiviteter som befinner seg der en fare kan ramme. Mer bebyggelse i et fareområde kan øke eksponeringen uten at selve naturfaren endrer seg.", "example": "Nye boliger på en flomutsatt slette kan gi større verdier som er eksponert for flom."}, {"id": "katastrofe-kort-03", "term": "Sårbarhet", "prompt": "Hvorfor kan like sterke hendelser gi ulik skade?", "answer": "Sårbarhet handler om hvor lett mennesker og samfunn skades, og hvilke muligheter de har til å håndtere og komme seg etter en hendelse. Byggeskikk, helse, økonomi, varsling og organisering kan påvirke sårbarheten.", "example": "To hus som rammes av samme vannstand kan få ulik skade fordi de er bygget og sikret forskjellig."}, {"id": "katastrofe-kort-04", "term": "Risiko", "prompt": "Hvordan henger fare, eksponering og sårbarhet sammen?", "answer": "Risiko handler om mulige skadevirkninger og usikkerheten om dem. Fare, eksponering og sårbarhet virker sammen; derfor kan risiko reduseres både ved å unngå fareområder og ved å gjøre samfunnet mindre sårbart.", "example": "Flomrisikoen kan reduseres ved å plassere ny bebyggelse høyere i terrenget selv om elvas flomfare er uendret."}, {"id": "katastrofe-kort-05", "term": "Beredskap", "prompt": "Hva innebærer beredskap før en naturhendelse?", "answer": "Beredskap er planer, ressurser og øving som gjør samfunnet i stand til å varsle og håndtere en hendelse. God beredskap kan redusere konsekvensene, men fjerner ikke nødvendigvis faren.", "example": "En kommune kan øve på evakuering og avtale hvor evakuerte skal få husly ved flom."}, {"id": "katastrofe-kort-06", "term": "Forebygging", "prompt": "Hva er forskjellen på forebygging og beredskap?", "answer": "Forebygging reduserer risiko før skaden skjer, for eksempel gjennom arealplanlegging eller sikring. Beredskap handler om å være klar til å varsle og håndtere hendelsen; tiltakene kan utfylle hverandre.", "example": "Å unngå nybygg i et flomområde er forebygging, mens en evakueringsplan er beredskap."}, {"id": "katastrofe-kort-07", "term": "Miljøkatastrofe", "prompt": "Hva bør du undersøke når en hendelse omtales som en miljøkatastrofe?", "answer": "Undersøk skadens omfang, alvorlighet og varighet for natur og samfunn, og dokumenter hendelsesforløpet. En miljøkatastrofe kan involvere både menneskelig aktivitet og naturlige prosesser, og virkningene må underbygges med kilder.", "example": "Ved et større oljeutslipp kan du undersøke spredning, skader på organismer og følger for fiskeri."}, {"id": "katastrofe-kort-08", "term": "Kildekritikk ved katastrofer", "prompt": "Hvorfor er kildekritikk særlig viktig mens en katastrofe pågår?", "answer": "Opplysninger kan være foreløpige, ufullstendige eller raskt endre seg. Oppgi dato, sammenlign relevante kilder og skill bekreftede forhold fra anslag og ubekreftede påstander.", "example": "Et tidlig anslag over skadde bygninger kan bli justert når flere områder er undersøkt."}, {"id": "katastrofe-kort-09", "term": "Hendelse og katastrofe", "prompt": "Hvorfor blir ikke enhver naturhendelse en katastrofe?", "answer": "En naturhendelse blir en katastrofe når den gir svært alvorlige forstyrrelser og skade i et berørt samfunn. Det avgjørende er derfor ikke bare den fysiske styrken, men også eksponering, sårbarhet og håndteringsevne.", "example": "Et kraftig jordskjelv langt fra bebyggelse kan få mindre samfunnsskade enn et svakere skjelv i en sårbar by."}, {"id": "katastrofe-kort-10", "term": "Klimaendringer og enkelthendelser", "prompt": "Kan du automatisk forklare én flom med klimaendringer?", "answer": "Nei, en enkelthendelse må undersøkes ut fra værforløp, terreng, hydrologi og andre relevante forhold. Klimaendringer kan påvirke sannsynlighet eller styrke for enkelte hendelsestyper, men en påstand om akkurat denne hendelsen krever relevant faglig dokumentasjon.", "example": "Ved en flom bør du undersøke nedbør, snøsmelting og lokale forhold før du vurderer dokumentasjon om klimaets rolle."}, {"id": "katastrofe-kort-11", "term": "Direkte og bakenforliggende årsaker", "prompt": "Hvordan skiller du utløsende og bakenforliggende årsaker?", "answer": "En direkte eller utløsende årsak setter hendelsen i gang, mens bakenforliggende forhold kan gjøre hendelsen mulig eller forsterke skaden. Analysen bør også skille årsaker til selve hendelsen fra årsaker til at følgene ble alvorlige.", "example": "Kraftig regn kan utløse en flom, mens bebyggelse i flomområdet bidrar til at mange verdier rammes."}, {"id": "katastrofe-kort-12", "term": "Korte og lange konsekvenser", "prompt": "Hvorfor bør katastrofens konsekvenser vurderes over tid?", "answer": "Umiddelbare følger kan være skader, evakuering og stengt infrastruktur. Senere kan hendelsen påvirke helse, økosystemer, næringsliv, flytting og gjenoppbygging, og belastningene kan være ulikt fordelt.", "example": "En flom kan stenge en butikk med én gang og samtidig gi langvarig inntektstap mens lokalet repareres."}]}]</script>
<script>(() => {
  'use strict';
  const TOPICS = JSON.parse(document.getElementById('geografi-data').textContent);
  const TASKS = TOPICS.flatMap(t => t.tasks.map(task => ({ ...task, topicId: t.id })));
  const KEY = 'geografi-muntlig-klar-v1';
  const LEVELS = ['Ikke øvd', 'Må repetere', 'På vei', 'Trygg'];
  const RUBRIC = [
    'Jeg brukte fagbegreper presist og forklarte dem.',
    'Jeg forklarte årsaker og konsekvenser.',
    'Jeg brukte konkrete geografiske eksempler.',
    'Jeg vurderte flere interesser eller mulige løsninger.',
    'Jeg brukte kart, figurer eller kilder og vurderte begrensninger.',
    'Jeg viste sammenhenger mellom natur og samfunn.'
  ];
  const BREADTH = {

l →', 'next-question', '', 'primary')}</div><div class="rule"></div><details><summary>Se hovedoppgaven</summary><p class="small" style="margin-top:12px">${esc(t.prompt)}</p></details><details style="margin-top:17px"><summary>Mine forberedelsesnotater</summary><label class="field" style="margin-top:12px"><span class="sr-only">Forberedelsesnotater</span><textarea data-session-field="notes" maxlength="100000" placeholder="Dine notater …">${esc(s.notes)}</textarea></label></details><div class="actions" style="margin-top:20px">${button('Avslutt samtalen og vurder øvingen', 'to-review', '', 'text compact')}</div></section>`}</div><aside class="exam-aside">${timerMarkup()}<section class="panel soft"><h3>${s.phase === 'prep' ? 'Bruk halvtimen godt' : 'Bygg et godt svar'}</h3>${s.phase === 'prep' ? '<ul class="list small"><li>0–5 min: Forstå oppgaven.</li><li>5–15 min: Velg begreper og eksempler.</li><li>15–25 min: Lag stikkord og noter kilder.</li><li>25–30 min: Øv på åpningen.</li></ul>' : '<ol class="list small"><li>Svar direkte på spørsmålet.</li><li>Forklar med fagbegreper.</li><li>Bruk et konkret eksempel.</li><li>Drøft ulike konsekvenser.</li><li>Gi en begrunnet vurdering.</li></ol>'}<p class="small">Forhåndsskrevne spørsmål. Ingen automatisk karakter.</p></section></aside></div>`;

  function sourcesView() { return `<div class="page-head"><div><div class="eyebrow muted">GRUNNLAG OG HJELPEMIDLER</div><h1>Kilder & lagring</h1><p>Faggrunnlag fra NDLA og Udir. Eksamensrammer for privatister i Akershus, kontrollert 2. november 2026.</p></div></div><div class="notice">Alle oppgavene i appen er egne øvingsoppgaver. De er ikke dokumenterte tidligere eksamensoppgaver, offisielle sensorveiledninger eller garantier for hva du får på eksamen.</div><div class="sources"><section class="panel"><h2>Fag og eksamen</h2>${link(SOURCES.ndla, 'NDLA · Geografi', 'source-link')}${link(SOURCES.exam, 'NDLA · Gjør deg klar til geografieksamen', 'source-link')}${link(SOURCES.udir, 'Udir · Læreplan GEO01-02', 'source-link')}${link(SOURCES.afk, 'Akershus · Retningslinjer for muntlig eksamen', 'source-link')}${link(SOURCES.afkPdf, 'Akershus · Retningslinjer som PDF, kapittel 4.6', 'source-link')}${link(SOURCES.aids, 'Akershus · Tillatte hjelpemidler', 'source-link')}${link(SOURCES.prep, 'Akershus · Forbered deg til privatisteksamen', 'source-link')}${link(SOURCES.portal, 'Privatistportalen · Tid og sted', 'source-link')}<p class="small" style="margin-top:18px">Vi fant ingen offentlig Akershus-spesifikk oppgavebank for muntlig GEO1003. Informasjon fra eksamensskolen kan presisere gjennomføringen.</p></section><section class="panel"><h2>Ta vare på øvingen</h2><p class="small">Fremdrift, kortstatus, notater og økter lagres automatisk i denne nettleseren på denne enheten. De følger ikke automatisk med til andre nettlesere eller enheter.</p><p class="small">Last ned en sikkerhetskopi for å flytte øvingen eller beholde den hvis nettleserdata slettes. Filen inneholder også notatene dine.</p><div class="actions" style="margin-top:20px">${button('Last ned sikkerhetskopi ↓', 'export', '', 'primary')}${button('Last inn sikkerhetskopi', 'import')}</div><p class="small muted" style="margin-top:14px">En innlasting erstatter øvingen i denne nettleseren. Du blir bedt om å bekrefte før noe   function render(focus = false) {

    const route = location.hash.slice(1).split('/');
    const page = ['oversikt', 'fag', 'eksamen', 'plan', 'kilder'].includes(route[0]) ? route[0] : 'oversikt';
    const labels = { oversikt: 'Oversikt', fag: 'Fagområder', eksamen: 'Eksamensrom', plan: 'Min plan', kilder: 'Kilder & lagring' };
    document.querySelectorAll('[data-nav]').forEach(b => { b.classList.toggle('active', b.dataset.nav === page); if (b.dataset.nav === page) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    $('#page-label').textContent = labels[page]; $('#side-date').textContent = dateLabel(state.examDate);
    const left = daysLeft(); $('#days-left').textContent = left > 0 ? `${left} ${left === 1 ? 'dag' : 'dager'} til eksamen` : left === 0 ? 'Eksamen i dag' : 'Fortsett i ditt tempo';
    document.title = `${labels[page]} · Geografi · Muntlig klar`;
    let html;
    if (page === 'fag') { const t = topic(route[1]); html = t ? route[2] === 'kort' ? cardsView(t) : topicDetail(t, route[2]) : topicIndex(); }
    else if (page === 'eksamen') html = route[1] === 'aktiv' && state.session ? examView() : setup();
    else if (page === 'plan') html = planView();
    else if (page === 'kilder') html = sourcesView();
    else html = route[1] === 'historikk' ? historyView() : dashboard();
    $('#main').innerHTML = html;
    if (focus) { $('#main').focus({ preventScroll: true }); window.scrollTo({ top: 0, behavior: 'instant' }); }
    if (!focus && focusKey) {
      const match = focusKey.id ? document.getElementById(focusKey.id) : [...$('#main').querySelectorAll('button,input,textarea,select')].find(el => Object.entries(focusKey.data).every(([k, v]) => el.dataset[k] === v));
      if (match) { match.focus({ preventScroll: true }); window.scrollTo(0, scroll); }
    }
    updateTimer();
  }
  function remaining(s) { return s.timer.running ? Math.min(1800000, Math.max(0, s.timer.deadline - Date.now())) : s.timer.remaining; }
  function timeString(ms) { const n = Math.ceil(ms / 1000); return `${String(Math.floor(n / 60)).padStart(2, '0')}:${String(n % 60).padStart(2, '0')}`; }
  function updateTimer() {
    const s = state.session;
    if (!s || s.phase === 'review') return;
    const left = remaining(s);
    if (left === 0 && s.timer.running) { s.timer = { running: false, remaining: 0, deadline: null }; save(); notify('Tiden er ute. Velg selv når du vil gå videre.'); const toggle = $('[data-action="toggle-timer"]'); if (toggle) { toggle.textContent = 'Start'; toggle.disabled = true; } }
    if ($('#timer-digits')) $('#timer-digits').textContent = timeString(left);
    if ($('#timer-status')) $('#timer-status').textContent = left === 0 ? 'Tiden er ute. Velg neste steg.' : s.timer.running ? 'Tidtakeren går' : 'Tidtakeren er pauset';
    if ($('#timer-panel')) $('#timer-panel').classList.toggle('expired', left === 0);
  }
  function makeSession(id) {
    const t = task(id); if (!t) return;
    if (state.session && !window.confirm('Starte en ny økt? Den pågående økten blir erstattet. Fullførte økter og andre notater beholdes.')) return;
    const other = TOPICS.filter(a => a.id !== t.topicId).sort((a, b) => average(a) - average(b))[0];
    const extra = BREADTH[other.id];
    const q = [
      { q: 'Hvordan vil du besvare hovedoppgaven? Gi en kort innledning, og forklar hvilke sammenhenger du vil undersøke.', cue: 'Svar på problemstillingen. Definer sentrale begreper, plasser eksempelet geografisk og vis hvordan natur og samfunn henger sammen. En innledning er valgfri på eksamen; her kan du også gå rett til spørsmålene.', level: 'Innledning', topicId: t.topicId },
      ...t.questions.map(q => ({ ...q, topicId: t.topicId })),
      { ...t.bridge, level: 'Se sammenhenger', topicId: t.topicId },
      { ...extra, level: 'Bredde i læreplanen', topicId: other.id }
    ];
    state.session = { id: String(Date.now()) + '-' + Math.random().toString(36).slice(2, 8), taskId: id, phase: 'prep', questions: q, index: 0, notes: '', reflection: '', next: '', checks: RUBRIC.map(() => false), rating: 0, created: Date.now(), timer: { running: true, remaining: 1800000, deadline: Date.now() + 1800000 } };
    save(); setRoute('eksamen/aktiv');
  }
  function pause() { const s = state.session; s.timer.remaining = remaining(s); s.timer.running = false; s.timer.deadline = null; }
  function toReview() { pause(); state.session.phase = 'review'; save(); render(true); }
  function exportBackup() {
    const json = JSON.stringify({ ...state, exportedAt: new Date().toISOString() }, null, 2);
    const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = `geografi-sikkerhetskopi-${today()}.json`; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); notify('Sikkerhetskopien er lastet ned.');
  }
  document.addEventListener('click', e => {
    if (e.target.closest('.skip')) { e.preventDefault(); $('#main').focus(); $('#main').scrollIntoView({ block: 'start' }); return; }
    const nav = e.target.closest('[data-nav]'); if (nav) { setRoute(nav.dataset.nav); return; }
    const b = e.target.closest('[data-action]'); if (!b || b.disabled) return;
    const action = b.dataset.action, id = b.dataset.id;
    if (action === 'open-topic') setRoute('fag/' + id);
    else if (action === 'open-cards') setRoute(`fag/${id}/kort`);
    else if (['flip-card', 'rate-card', 'previous-card', 'next-card', 'shuffle-cards', 'restart-cards', 'review-cards', 'all-cards', 'last-card'].includes(action) && topic(id)) {
      const t = topic(id), deck = decks[id] || startDeck(t);
      if (action === 'flip-card') deck.flipped = !deck.flipped;
      else if (action === 'shuffle-cards') startDeck(t, deck.mode, true);
      else if (action === 'restart-cards') startDeck(t, deck.mode);
      else if (action === 'review-cards') startDeck(t, 'review');
      else if (action === 'all-cards') startDeck(t, 'all');
      else if (action === 'last-card') { deck.completed = false; deck.index = deck.ids.length - 1; deck.flipped = false; }
      else if (action === 'previous-card') { deck.index = Math.max(0, deck.index - 1); deck.flipped = false; }
      else {
        if (action === 'rate-card') {
          if (!deck.flipped || !deck.ids[deck.index]) return;
          state.cardProgress[deck.ids[deck.index]] = Number(b.dataset.value); save();
        }
        if (deck.index === deck.ids.length - 1) deck.completed = true;
        else deck.index++;
        deck.flipped = false;
      }
      render(); if (['rate-card', 'next-card', 'previous-card', 'last-card', 'review-cards', 'all-cards'].includes(action)) focusCard();
    }
    else if (action === 'select-task') setRoute(`fag/${b.dataset.topic}/${id}`);
    else if (action === 'history') setRoute('oversikt/historikk');
    else if (action === 'dashboard') setRoute('oversikt');
    else if (action === 'go-fag') setRoute('fag');
    else if (action === 'go-exam') setRoute('eksamen');
    else if (action === 'resume') setRoute('eksamen/aktiv');
    else if (action === 'leave-session') setRoute('eksamen');
    else if (action === 'rate-task') { state.progress[id] = Number(b.dataset.value); save(); const group = b.closest('.ratings'); group.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); document.querySelectorAll('.task-choice').forEach(x => { if (x.dataset.id === id) x.lastElementChild.textContent = LEVELS[state.progress[id]]; }); notify('Egenvurderingen er lagret.'); }
    else if (action === 'select-all' || action === 'select-none') { state.selectedTopics = action === 'select-all' ? TOPICS.map(t => t.id) : []; save(); render(); }
    else if (action === 'draw' || action === 'draw-all') { const pool = action === 'draw-all' ? TASKS : TASKS.filter(t => state.selectedTopics.includes(t.topicId)); if (pool.length) makeSession(pool[Math.floor(Math.random() * pool.length)].id); }
    else if (action === 'start-task') makeSession(id);
    else if (action === 'start-selected') { const select = $('#specific-task'); if (select?.value) makeSession(select.value); }
    else if (action === 'toggle-timer' && state.session) { if (state.session.timer.running) pause(); else { state.session.timer.deadline = Date.now() + state.session.timer.remaining; state.session.timer.running = true; } save(); render(); }
    else if (action === 'reset-timer' && state.session) { state.session.timer = { remaining: 1800000, running: false, deadline: null }; save(); render(); }
    else if (action === 'start-talk' && state.session) { state.session.phase = 'talk'; state.session.timer = { remaining: 1800000, running: true, deadline: Date.now() + 1800000 }; save(); render(true); }
    else if (action === 'next-question' && state.session) { if (state.session.index === state.session.questions.length - 1) toReview(); else { state.session.index++; save(); render(true); } }
    else if (action === 'previous-question' && state.session) { state.session.index = Math.max(0, state.session.index - 1); save(); render(true); }
    else if (action === 'to-review' && state.session) toReview();
    else if (action === 'rate-session' && state.session) { state.session.rating = Number(b.dataset.value); save(); render(); }
    else if (action === 'finish-session' && state.session?.rating) {
      const s = state.session;
      state.progress[s.taskId] = s.rating;
      state.history.push({ id: s.id, taskId: s.taskId, finished: Date.now(), rating: s.rating, notes: s.notes, checks: s.checks, reflection: s.reflection, next: s.next });
      state.history = state.history.slice(-500); state.session = null; save(); setRoute('oversikt'); notify('Øvingen er lagret. Godt jobbet med å svare høyt!');
    }
    else if (action === 'export') exportBackup();
    else if (action === 'import') $('#import-file').click();
  });
  document.addEventListener('input', e => {
    const el = e.target;
    if (el.id === 'topic-search') { search = el.value; $('#topic-results').innerHTML = filteredTopics(); }
    else if (el.dataset.topicNote) { state.notes[el.dataset.topicNote] = el.value; save(); }
    else if (el.dataset.taskNote) { state.taskNotes[el.dataset.taskNote] = el.value; save(); }
    else if (el.dataset.sessionField && state.session && ['notes', 'reflection', 'next'].includes(el.dataset.sessionField)) { state.session[el.dataset.sessionField] = el.value; save(); }
  });
  document.addEventListener('change', async e => {
    const el = e.target;
    if (el.id === 'card-filter' && topic(el.dataset.topic)) { startDeck(topic(el.dataset.topic), el.value === 'review' ? 'review' : 'all'); render(); }
    else if (el.dataset.concept) { state.concepts[el.dataset.concept] = el.checked; save(); }
    else if (el.dataset.poolTopic) { state.selectedTopics = TOPICS.filter(t => t.id === el.dataset.poolTopic ? el.checked : state.selectedTopics.includes(t.id)).map(t => t.id); save(); render(); }
    else if (el.dataset.rubric != null && state.session) { state.session.checks[Number(el.dataset.rubric)] = el.checked; save(); }
    else if (el.dataset.planDate) { state.plan[el.dataset.planDate] = el.checked; save(); el.closest('.plan-row').classList.toggle('done', el.checked); }
    else if (el.id === 'exam-date') { if (dateValid(el.value) && el.value >= '2020-01-01' && el.value <= '2100-12-31') { state.examDate = el.value; save(); render(); notify('Planen er tilpasset eksamensdatoen.'); } else { notify('Velg en gyldig eksamensdato.'); el.value = state.examDate; } }
    else if (el.id === 'import-file' && el.files?.[0]) {
      try {
        const file = el.files[0]; if (file.size > 5 * 1024 * 1024) throw new Error('Filen er for stor. Velg en sikkerhetskopi under 5 MB.');
        const imported = cleanState(JSON.parse(await file.text()));
        if (window.confirm('Erstatte øvingen i denne nettleseren med sikkerhetskopien? Last ned dagens øving først hvis du vil beholde begge.')) { state = imported; decks = {}; save(); render(true); notify('Sikkerhetskopien er lastet inn.'); }
      } catch (error) { notify(error instanceof SyntaxError ? 'Filen inneholder ikke gyldig JSON. Øvingen din er beholdt.' : error.message || 'Sikkerhetskopien kunne ikke lastes inn.'); }
      finally { el.value = ''; }
    }
  });
  window.addEventListener('hashchange', () => render(true));
  document.addEventListener('visibilitychange', updateTimer);
  setInterval(updateTimer, 500);
  render();
})();
</script>
