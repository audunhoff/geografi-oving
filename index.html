<script id="geografi-data" type="application/json">[{"id": "baerekraft", "title": "Bærekraftig utvikling", "subtitle": "Se miljø, økonomi og sosiale forhold i sammenheng.", "ndla": "https://ndla.no/nb/r/geografi/barekraftig-utvikling-hva-kan-du-na/1991ed721c", "concepts": ["bærekraftig utvikling", "miljømessig bærekraft", "økonomisk bærekraft", "sosial bærekraft", "målkonflikt", "naturmangfold", "ressursfordeling", "generasjonsperspektiv"], "goals": ["Forklare de tre dimensjonene ved bærekraft med konkrete eksempler.", "Undersøke hvordan et tiltak kan gi både gevinster og ulemper.", "Begrunne en vurdering som tar hensyn til ulike grupper og tidsperspektiver."], "tasks": [{"id": "baerekraft-1", "title": "En mer bærekraftig hjemby", "prompt": "Kommunen vil gjøre sentrum mer bærekraftig gjennom færre parkeringsplasser, bedre kollektivtransport og flere grøntområder. Forklar hvordan tiltakene kan påvirke miljø, økonomi og sosiale forhold. Drøft hvilke hensyn kommunen bør prioritere.", "focus": ["De tre dimensjonene ved bærekraft", "Ulike behov hos innbyggere og næringsliv", "Arealbruk og transport", "Kortsiktige og langsiktige virkninger", "En begrunnet prioritering"], "questions": [{"q": "Hva innebærer de tre dimensjonene ved bærekraftig utvikling?", "cue": "Forklar hver dimensjon, og knytt dem til det samme tiltaket.", "level": "Forklare"}, {"q": "Hvilke opplysninger ville du samlet før kommunen fjerner parkeringsplassene?", "cue": "Tenk på reisevaner, tilgjengelighet, handel, utslipp og hvem som blir berørt.", "level": "Anvende"}, {"q": "Hvordan kan flere grøntområder påvirke både miljøet og menneskene som bor der?", "cue": "Koble naturmangfold og håndtering av regnvann til trivsel og helse.", "level": "Anvende"}, {"q": "Kan et tiltak være miljøvennlig og samtidig sosialt problematisk?", "cue": "Vurder kostnader, funksjonsnedsettelser, bosted og tilgang til alternativer.", "level": "Drøfte"}, {"q": "Hvilket tiltak ville du prioritert først, og hva kan tale mot valget ditt?", "cue": "Vei gevinstene mot ulempene og si hvilke forutsetninger vurderingen bygger på.", "level": "Drøfte"}], "bridge": {"q": "Hvordan kan befolkningsvekst og urbanisering endre kommunens bærekraftsutfordringer?", "cue": "Koble demografi til behov for boliger, transport, tjenester og arealer."}}, {"id": "baerekraft-2", "title": "Mobiltelefonens bærekraftsregnskap", "prompt": "Bruk en mobiltelefon som eksempel på sammenhengen mellom eget forbruk og bærekraftig utvikling. Undersøk virkninger fra råvareuttak til avfall. Drøft hva forbrukere, produsenter og myndigheter kan gjøre.", "focus": ["Ressurser og produktets livsløp", "Sosiale forhold i produksjonen", "Global fordeling av gevinster og belastninger", "Reparasjon, ombruk og materialgjenvinning", "Tiltak på flere nivåer"], "questions": [{"q": "Hva menes med å undersøke et produkts livsløp?", "cue": "Følg råvarer, produksjon, transport, bruk og avfall.", "level": "Forklare"}, {"q": "Hvor kan miljøbelastninger og verdiskaping oppstå i mobilens produksjonskjede?", "cue": "Beskriv flere ledd og unngå å anta at alle land får samme gevinster.", "level": "Anvende"}, {"q": "Hvilke kilder trenger du for å vurdere en produsents miljøpåstander?", "cue": "Se etter dokumentasjon, avgrensninger, uavhengige undersøkelser og hva påstanden utelater.", "level": "Anvende"}, {"q": "Er materialgjenvinning nok til å gjøre mobilforbruket bærekraftig?", "cue": "Vurder ressursbehov og energibruk sammen med levetid, reparasjon og samlet forbruk.", "level": "Drøfte"}, {"q": "Hvem har størst mulighet til å endre produksjonskjeden?", "cue": "Sammenlign handlingsrommet til forbrukere, bedrifter og myndigheter.", "level": "Drøfte"}], "bridge": {"q": "Hvorfor er ulike ledd i mobilproduksjonen lokalisert i forskjellige land?", "cue": "Koble bærekraft til råvarer, kompetanse, arbeidskraft, markeder og globale verdikjeder."}}, {"id": "baerekraft-3", "title": "Fornybar energi og naturhensyn", "prompt": "Et område med verdifull natur vurderes brukt til ny fornybar energiproduksjon. Forklar hvorfor prosjektet kan skape målkonflikter. Drøft hvordan behovet for energi kan veies mot naturhensyn og interessene til dem som bruker området.", "focus": ["Forskjellen mellom fornybar og bærekraftig", "Klima og natur som ulike hensyn", "Berørte grupper og fordeling", "Alternativer til ny utbygging", "Geografisk nivå og tidsperspektiv"], "questions": [{"q": "Hvorfor betyr ikke fornybar automatisk bærekraftig?", "cue": "Skille mellom at en ressurs fornyes og virkningene av å utnytte den.", "level": "Forklare"}, {"q": "Hvilke parter og interesser bør inngå i undersøkelsen av prosjektet?", "cue": "Tenk på energibrukere, utbyggere, lokalsamfunn, naturvern og eksisterende brukere.", "level": "Anvende"}, {"q": "Hvordan kan et kart hjelpe deg med å vurdere plasseringen?", "cue": "Se etter bebyggelse, inngrep, naturverdier, ferdsel og sammenhengende bruksområder.", "level": "Anvende"}, {"q": "Hvordan kan prosjektet være gunstig nasjonalt, men problematisk lokalt?", "cue": "Skill mellom hvor strømmen eller inntektene brukes, og hvor belastningene oppstår.", "level": "Drøfte"}, {"q": "Hvilke alternativer bør vurderes før et nytt naturområde bygges ut?", "cue": "Vurder energisparing, effektivisering, andre lokaliseringer og bruk av allerede påvirkede arealer.", "level": "Drøfte"}], "bridge": {"q": "Hvordan kan en slik utbygging berøre samiske interesser i Sápmi?", "cue": "Koble arealinngrep til naturgrunnlag, reindrift, kulturutøvelse og medvirkning uten å generalisere alle saker."}}], "cards": [{"id": "baerekraft-kort-01", "term": "Bærekraftig utvikling", "prompt": "Hva innebærer bærekraftig utvikling?", "answer": "Utvikling må møte menneskers behov samtidig som naturgrunnlaget og mulighetene til kommende generasjoner ivaretas. Miljømessige, økonomiske og sosiale forhold må vurderes i sammenheng.", "example": "Et nytt boligområde kan vurderes ut fra både naturinngrep, boligkostnader og tilgang til skole og transport."}, {"id": "baerekraft-kort-02", "term": "Miljømessig bærekraft", "prompt": "Hva handler miljømessig bærekraft om?", "answer": "Miljømessig bærekraft handler om å bevare naturgrunnlaget som mennesker og andre arter er avhengige av. Det omfatter blant annet klima, naturmangfold, forurensning og bruk av ressurser.", "example": "Å bevare en myr kan beskytte leveområder, lagret karbon og områdets evne til å holde på vann."}, {"id": "baerekraft-kort-03", "term": "Økonomisk bærekraft", "prompt": "Hva betyr økonomisk bærekraft?", "answer": "Økonomisk aktivitet må kunne opprettholde livsgrunnlag og verdiskaping over tid. En vurdering må også ta med kostnader som faller på andre, som forurensning og tap av natur.", "example": "Et fiskevær trenger inntekter fra fiskeri, men også et ressursgrunnlag som gjør framtidig fiske mulig."}, {"id": "baerekraft-kort-04", "term": "Sosial bærekraft", "prompt": "Hva handler sosial bærekraft om?", "answer": "Sosial bærekraft handler om livsvilkår, rettigheter, deltakelse og en rimelig fordeling av muligheter og belastninger. Helse, utdanning, trygghet og kulturelle livsgrunnlag er relevante hensyn.", "example": "Et nytt kollektivtilbud kan gi flere tilgang til arbeid og skole, også dem som ikke har bil."}, {"id": "baerekraft-kort-05", "term": "Målkonflikt", "prompt": "Hva er en målkonflikt i bærekraftsarbeid?", "answer": "En målkonflikt oppstår når et tiltak som fremmer ett mål, gjør det vanskeligere å nå et annet. Konflikten må vurderes ut fra alternativer, geografisk nivå, tidsperspektiv og hvem som berøres.", "example": "Ny fornybar energiproduksjon kan bidra til lavere utslipp og samtidig kreve inngrep i verdifull natur."}, {"id": "baerekraft-kort-06", "term": "Naturmangfold", "prompt": "Hva omfatter naturmangfold?", "answer": "Naturmangfold omfatter variasjon innen arter, mellom arter og mellom økosystemer. Mangfoldet er viktig både som verdi i seg selv og for naturens funksjoner og menneskers livsgrunnlag.", "example": "En skog kan romme ulike treslag, genetisk variasjon og mange leveområder for sopp, insekter og fugler."}, {"id": "baerekraft-kort-07", "term": "Ressursfordeling", "prompt": "Hvorfor er ressursfordeling en del av bærekraft?", "answer": "Det er ikke bare samlet ressursbruk som betyr noe, men også hvem som får tilgang til ressursene og hvem som bærer belastningene. Fordelingen kan være ulik både mellom land og innad i et samfunn.", "example": "En gruve kan gi inntekter til eiere og arbeidsplasser lokalt, mens naboene får støy og naturinngrep."}, {"id": "baerekraft-kort-08", "term": "Generasjonsperspektiv", "prompt": "Hva betyr det å vurdere et tiltak i et generasjonsperspektiv?", "answer": "Det betyr å undersøke hvordan dagens valg påvirker mennesker som skal leve senere. Langvarige og irreversible endringer må vurderes selv om gevinstene kommer raskt.", "example": "Nedbygging av matjord kan gi boliger nå og samtidig redusere framtidige muligheter for matproduksjon."}, {"id": "baerekraft-kort-09", "term": "Lokalt og globalt perspektiv", "prompt": "Hvorfor kan bærekraft se forskjellig ut lokalt og globalt?", "answer": "Gevinster og belastninger fra et tiltak kan oppstå på ulike steder. En god vurdering undersøker hele sammenhengen og om problemer bare flyttes til andre områder.", "example": "En utslippsfri buss under kjøring kan fortsatt være knyttet til naturinngrep gjennom råvarene som brukes i produksjonen."}, {"id": "baerekraft-kort-10", "term": "Livsløpsperspektiv", "prompt": "Hva innebærer et livsløpsperspektiv på et produkt?", "answer": "Du undersøker produktet fra råvareuttak og produksjon gjennom transport og bruk til ombruk, gjenvinning eller avfall. Da blir det lettere å finne ut hvor belastningene oppstår og hvilke tiltak som virker.", "example": "En mobiltelefon vurderes også ut fra mineralutvinning, produksjon og levetid, ikke bare strømforbruket ved lading."}, {"id": "baerekraft-kort-11", "term": "Sirkulær økonomi", "prompt": "Hvordan kan sirkulær økonomi redusere ressursbruk?", "answer": "Produkter og materialer beholdes i bruk gjennom lengre levetid, reparasjon, ombruk og materialgjenvinning. Kretsløpene krever fortsatt ressurser og energi, så samlet forbruk må også vurderes.", "example": "Et møbelverksted kan reparere brukte stoler og erstatte behovet for noen nye møbler."}, {"id": "baerekraft-kort-12", "term": "Synergi", "prompt": "Hva er en synergi mellom bærekraftsmål?", "answer": "En synergi oppstår når et tiltak bidrar positivt til flere mål samtidig. Gevinstene må undersøkes konkret, fordi et tiltak også kan ha ulemper for andre hensyn.", "example": "Et regnbed kan håndtere regnvann og samtidig gi planter og insekter et leveområde."}]}, {"id": "indre", "title": "Indre krefter", "subtitle": "Forklar platedrift, landskap, naturfarer og ressurser.", "ndla": "https://ndla.no/nb/r/geografi/indre-krefter-hva-kan-du-na/653f822c00", "concepts": ["litosfæreplater", "spredningssone", "subduksjon", "glidegrense", "jordskjelv", "vulkanisme", "bergartenes kretsløp", "naturfare"], "goals": ["Forklare hva som skjer ved ulike plategrenser med en enkel skisse.", "Koble indre krefter til landskapsdannelse, naturfarer og ressurser.", "Drøfte hvordan mennesker kan leve med og redusere risiko fra naturfarer."], "tasks": [{"id": "indre-1", "title": "Island: muligheter og naturfarer", "prompt": "Forklar hvordan indre krefter har bidratt til å forme Island. Vis sammenhenger mellom geologiske prosesser, ressurser og naturfarer. Drøft hvordan samfunnet kan utnytte ressursene og samtidig redusere risiko.", "focus": ["Spredningssone og varmepunkt", "Vulkanisme og landskapsdannelse", "Geotermisk energi", "Bosetting og infrastruktur", "Overvåking og beredskap"], "questions": [{"q": "Hva skjer når to litosfæreplater beveger seg fra hverandre?", "cue": "Bruk en skisse og forklar oppstigning av magma og dannelse av ny jordskorpe.", "level": "Forklare"}, {"q": "Hvorfor er ikke plategrensen alene hele forklaringen på Islands vulkanisme?", "cue": "Ta med varmepunktet og hvordan de to forholdene virker sammen.", "level": "Forklare"}, {"q": "Hvordan kan varme fra jordas indre brukes som en ressurs?", "cue": "Knytt naturgrunnlaget til oppvarming eller elektrisitetsproduksjon.", "level": "Anvende"}, {"q": "Hvorfor velger mennesker å bo nær aktive vulkanske områder?", "cue": "Vurder ressurser, arbeidsplasser, tilhørighet og risiko i sammenheng.", "level": "Drøfte"}, {"q": "Hvordan kan myndighetene redusere konsekvensene av et utbrudd?", "cue": "Skill mellom å hindre selve naturhendelsen og å redusere eksponering og sårbarhet.", "level": "Drøfte"}], "bridge": {"q": "Er geotermisk energi alltid et bærekraftig valg?", "cue": "Koble energibruk til lokale naturinngrep, utslipp, ressursforvaltning og alternativer."}}, {"id": "indre-2", "title": "Når et jordskjelv blir en katastrofe", "prompt": "Forklar hvorfor jordskjelv oppstår, og hvordan de kan påvirke mennesker, samfunn og natur. Sammenlign to tenkte områder med lik skjelvstyrke, men ulik bebyggelse og beredskap. Drøft hvorfor konsekvensene kan bli forskjellige.", "focus": ["Spenninger og bevegelse langs forkastninger", "Fokus og episenter", "Skjelvstyrke og skadevirkninger", "Eksponering og sosial sårbarhet", "Forebygging og beredskap"], "questions": [{"q": "Hvordan kan platebevegelser føre til et plutselig jordskjelv?", "cue": "Beskriv oppbygging av spenning og brå bevegelse langs en forkastning.", "level": "Forklare"}, {"q": "Hva er forskjellen på fokus og episenter?", "cue": "Vis punktene på en enkel skisse av jordskorpa.", "level": "Forklare"}, {"q": "Hvorfor kan ikke skjelvets styrke alene fortelle hvor store skadene blir?", "cue": "Ta med dybde, avstand, grunnforhold, bebyggelse og beredskap.", "level": "Anvende"}, {"q": "Når kan et undersjøisk jordskjelv bidra til å utløse en tsunami?", "cue": "Forklar behovet for stor og rask forskyvning av vannmassene; ikke alle havskjelv lager tsunami.", "level": "Anvende"}, {"q": "Hvilke tiltak bør et sårbart samfunn prioritere med begrensede ressurser?", "cue": "Vurder byggesikkerhet, arealplanlegging, varsling, øvelser og kritisk infrastruktur.", "level": "Drøfte"}], "bridge": {"q": "Hvordan henger levekår sammen med konsekvensene av naturkatastrofer?", "cue": "Koble økonomi, helse, infrastruktur og styring til evnen til å forebygge og håndtere kriser."}}, {"id": "indre-3", "title": "Berggrunnen som ressurs", "prompt": "Forklar hvordan de tre hovedtypene bergarter dannes, og hvordan berggrunnen kan gi grunnlag for ressursutnyttelse. Bruk et konkret eller tenkt mineralprosjekt som eksempel. Drøft muligheter og utfordringer ved utvinning.", "focus": ["Magmatiske, sedimentære og metamorfe bergarter", "Bergartenes kretsløp", "Mineralforekomster og økonomisk utnyttelse", "Arbeidsplasser og råvarebehov", "Naturinngrep, avfall og arealkonflikter"], "questions": [{"q": "Hvordan dannes magmatiske, sedimentære og metamorfe bergarter?", "cue": "Forklar prosessene med størkning, avsetning og omdanning.", "level": "Forklare"}, {"q": "Hvordan kan én bergart etter hvert bli omdannet til en annen type?", "cue": "Følg et mulig forløp gjennom bergartenes kretsløp.", "level": "Anvende"}, {"q": "Hvorfor er ikke alle mineralforekomster økonomiske ressurser?", "cue": "Vurder innhold, tilgjengelighet, teknologi, kostnader og etterspørsel.", "level": "Anvende"}, {"q": "Kan behovet for mineraler til ny teknologi begrunne nye naturinngrep?", "cue": "Vei ressursbehov mot lokal belastning, alternativer, ombruk og samlet forbruk.", "level": "Drøfte"}, {"q": "Hva bør undersøkes før en kommune støtter et nytt gruveprosjekt?", "cue": "Ta med arbeidsplasser, naturverdier, vannmiljø, avfall, andre arealbrukere og usikkerhet.", "level": "Drøfte"}], "bridge": {"q": "Hvordan kan globale verdikjeder påvirke et lokalt mineralprosjekt?", "cue": "Koble lokal ressursutnyttelse til etterspørsel, bearbeiding og fordeling av verdier andre steder."}}], "cards": [{"id": "indre-kort-01", "term": "Litosfæreplater", "prompt": "Hva er litosfæreplater?", "answer": "Litosfæren består av jordskorpa og den øverste faste delen av mantelen. Den er delt i plater som beveger seg i forhold til hverandre og kan omfatte både havbunn og kontinenter.", "example": "Ved Island beveger den nordamerikanske og den eurasiske plata seg fra hverandre."}, {"id": "indre-kort-02", "term": "Spredningssone", "prompt": "Hva skjer i en spredningssone?", "answer": "To litosfæreplater beveger seg fra hverandre. Magma kan stige opp og størkne til ny jordskorpe, slik det skjer langs midthavsrygger.", "example": "Den midtatlantiske ryggen er et område der ny havbunn dannes."}, {"id": "indre-kort-03", "term": "Subduksjon", "prompt": "Hva er subduksjon?", "answer": "Subduksjon skjer når en plate med havbunn synker ned under en annen plate og inn i mantelen. Prosessen kan være knyttet til dyphavsgroper, sterke jordskjelv og vulkanisme.", "example": "Langs vestkysten av Sør-Amerika synker Nazcaplata ned under den søramerikanske plata."}, {"id": "indre-kort-04", "term": "Glidegrense", "prompt": "Hva kjennetegner en glidegrense?", "answer": "To plater beveger seg sidelengs i forhold til hverandre. Friksjon kan holde bevegelsen igjen slik at spenninger bygges opp og utløses som jordskjelv.", "example": "San Andreas-forkastningen i California er knyttet til sidelengs bevegelse mellom plater."}, {"id": "indre-kort-05", "term": "Jordskjelv", "prompt": "Hvordan oppstår et jordskjelv?", "answer": "Et jordskjelv oppstår når oppbygde spenninger utløses ved en brå bevegelse i berggrunnen. Energien sprer seg som bølger, og skadevirkningene avhenger også av dybde, grunnforhold, bebyggelse og beredskap.", "example": "Et grunt skjelv nær tett bebyggelse kan få store følger selv om et sterkere skjelv langt unna gjør mindre skade."}, {"id": "indre-kort-06", "term": "Vulkanisme", "prompt": "Hva er vulkanisme?", "answer": "Vulkanisme er prosesser der magma, gasser og annet materiale fra jordas indre beveger seg opp mot eller ut på overflaten. Det forekommer blant annet ved spredningssoner, subduksjonssoner og varmepunkter.", "example": "Island har vulkanisme knyttet til både en spredningssone og et varmepunkt."}, {"id": "indre-kort-07", "term": "Bergartenes kretsløp", "prompt": "Hvordan kan bergarter skifte fra én type til en annen?", "answer": "Bergarter kan forvitre, bli transportert og avsatt, bli begravd og omdannet eller smelte og størkne. Kretsløpet har flere mulige veier og følger ikke én fast rekkefølge.", "example": "Granitt kan forvitre til sand som senere inngår i en sedimentær bergart."}, {"id": "indre-kort-08", "term": "Naturfare", "prompt": "Hva skiller en naturfare fra en katastrofe?", "answer": "En naturfare er en naturlig prosess eller hendelse som kan forårsake skade. Om hendelsen blir en katastrofe, avhenger også av hvem og hva som rammes og samfunnets sårbarhet.", "example": "Et vulkanutbrudd i et ubebodd område kan gi andre konsekvenser enn et utbrudd nær en by."}, {"id": "indre-kort-09", "term": "Magma og lava", "prompt": "Hva er forskjellen på magma og lava?", "answer": "Magma er smeltet steinmateriale under jordoverflaten, ofte med krystaller og oppløste gasser. Når smeltematerialet kommer ut på overflaten, kalles det lava.", "example": "Lava fra et utbrudd kan avkjøles og bli til en magmatisk bergart."}, {"id": "indre-kort-10", "term": "Magmatisk bergart", "prompt": "Hvordan dannes magmatiske bergarter?", "answer": "De dannes når magma eller lava avkjøles og størkner. Avkjølingsforholdene påvirker blant annet krystallstørrelsen i bergarten.", "example": "Granitt dannes ved størkning av magma nede i jordskorpa."}, {"id": "indre-kort-11", "term": "Sedimentær bergart", "prompt": "Hvordan dannes sedimentære bergarter?", "answer": "De kan dannes når sedimenter blir presset og bundet sammen til fast bergart. Noen dannes også ved utfelling fra vann eller opphopning av biologisk materiale.", "example": "Sandstein dannes når sandkorn blir bundet sammen til bergart."}, {"id": "indre-kort-12", "term": "Metamorf bergart", "prompt": "Hvordan dannes metamorfe bergarter?", "answer": "En eksisterende bergart omdannes ved endrede trykk- og temperaturforhold uten å smelte helt. Mineraler og struktur kan forandres.", "example": "Kalkstein kan omdannes til marmor."}]}, {"id": "ytre", "title": "Ytre krefter og landskap", "subtitle": "Les spor etter vann, is, forvitring og massebevegelser.", "ndla": "https://ndla.no/nb/r/geografi/ytre-krefter-hva-kan-du-na/bf6a846888", "concepts": ["forvitring", "erosjon", "transport", "avsetning", "breerosjon", "elvelandskap", "løsmasser", "skred"], "goals": ["Skille mellom forvitring, erosjon, transport og avsetning.", "Forklare hvordan elver og breer danner gjenkjennelige landskap.", "Koble landskap og løsmasser til ressursbruk, bosetting og naturfare."], "tasks": [{"id": "ytre-1", "title": "Fra isbre til fjordlandskap", "prompt": "Forklar hvordan breer har bidratt til å forme et norsk fjordlandskap. Vis hvordan landskapsformene kan gi både ressurser og utfordringer for dem som bor der. Bruk et landskapsbilde eller en egen skisse.", "focus": ["Skuring og plukking", "U-dal og fjord", "Landskap formet over lang tid", "Bosetting, transport og næringsliv", "Bratte dalsider og naturfare"], "questions": [{"q": "Hvordan eroderer en isbre underlaget sitt?", "cue": "Forklar både skuring og plukking og rollen til steinmateriale i breen.", "level": "Forklare"}, {"q": "Hvordan kan en dal bli til en fjord?", "cue": "Koble breerosjon til en dal som blir fylt av hav etter at isen forsvinner.", "level": "Forklare"}, {"q": "Hvilke spor ville du lett etter i et bilde for å undersøke om breer har formet landskapet?", "cue": "Se etter dalprofil, fjord, hengende daler og avrundede eller skurte bergflater.", "level": "Anvende"}, {"q": "Hvordan kan samme landskap gi grunnlag for både næringsliv og transportutfordringer?", "cue": "Koble landskapsformene til turisme, vannkraft, bosetting, veier og fjordkryssinger.", "level": "Drøfte"}, {"q": "Hva bør kommunen undersøke før den bygger nye boliger ved en bratt fjordside?", "cue": "Vurder skredfare, grunnforhold, flom, adkomst og beredskap med relevante kart.", "level": "Drøfte"}], "bridge": {"q": "Hvordan kan klimaendringer påvirke naturfarene i et slikt område?", "cue": "Koble endret nedbør og temperatur til konkrete lokale forhold; unngå å anta lik utvikling overalt."}}, {"id": "ytre-2", "title": "Elva former dalen", "prompt": "Forklar hvordan ei elv former landskapet gjennom erosjon, transport og avsetning. Bruk en skisse fra fjell til elvemunning. Drøft hvordan mennesker kan utnytte elva og redusere skader fra flom.", "focus": ["Vannføring, fart og transportevne", "Erosjon og dalutvikling", "Meandere og avsetningsområder", "Elvesletter eller delta", "Ressursbruk og flomtilpasning"], "questions": [{"q": "Hva skiller erosjon fra forvitring og avsetning?", "cue": "Skill mellom nedbryting på stedet, fjerning og transport, og materiale som legges igjen.", "level": "Forklare"}, {"q": "Når kan ei elv transportere mye og grovt materiale?", "cue": "Koble transportevnen til vannføring, strømhastighet og forholdene i elveløpet.", "level": "Forklare"}, {"q": "Hvor ville du forventet erosjon og avsetning i en elvesving?", "cue": "Forklar forskjeller mellom yttersving og innersving med en skisse.", "level": "Anvende"}, {"q": "Hvorfor kan elvesletter være attraktive, men utsatte områder?", "cue": "Vei jordbruk, bosetting og transport mot flomfare og endringer i elveløpet.", "level": "Drøfte"}, {"q": "Bør kommunen bygge flomvoller eller gi elva mer plass?", "cue": "Vurder beskyttelse, arealbehov, natur, kostnader og mulige virkninger andre steder langs elva.", "level": "Drøfte"}], "bridge": {"q": "Hvordan kan utbygging i nedbørfeltet endre flomrisikoen?", "cue": "Koble tette flater, vegetasjon og overvannshåndtering til avrenning og arealplanlegging."}}, {"id": "ytre-3", "title": "Løsmasser, skred og trygg arealbruk", "prompt": "Et tettsted planlegger boliger i et område med løsmasser, en bekk og en bratt skråning. Forklar hvilke ytre prosesser som kan være relevante. Drøft hvilke undersøkelser og tiltak som trengs før området eventuelt bygges ut.", "focus": ["Forvitring og massebevegelser", "Løsmassenes egenskaper", "Erosjon og vannforhold", "Naturfare, eksponering og sårbarhet", "Kartlegging og arealplanlegging"], "questions": [{"q": "Hva er løsmasser, og hvordan kan de ha blitt avsatt?", "cue": "Gi eksempler på materiale avsatt av bre, elv eller hav.", "level": "Forklare"}, {"q": "Hvordan kan vann påvirke stabiliteten i en skråning?", "cue": "Tenk på erosjon, vanninnhold, poretrykk og materialenes egenskaper.", "level": "Forklare"}, {"q": "Hvilke kart og observasjoner ville du brukt i en første undersøkelse?", "cue": "Se etter terreng, løsmasser, tidligere hendelser og farekart; en skoleobservasjon erstatter ikke en faglig grunnundersøkelse.", "level": "Anvende"}, {"q": "Hvorfor er det viktig å skille et aktsomhetsområde fra dokumentert fare på en tomt?", "cue": "Forklar hva kartene kan indikere, og hvorfor mer detaljerte undersøkelser kan være nødvendige.", "level": "Anvende"}, {"q": "Hvordan bør kommunen veie boligbehov mot usikker naturfare?", "cue": "Vurder alternativer, konsekvenser, kunnskapsbehov og hvem som bærer risikoen.", "level": "Drøfte"}], "bridge": {"q": "Hvordan ville du undersøkt overvann i nærområdet gjennom feltarbeid?", "cue": "Formuler et avgrenset spørsmål, velg observasjoner og drøft hva metoden kan og ikke kan vise."}}], "cards": [{"id": "ytre-kort-01", "term": "Forvitring", "prompt": "Hva er forvitring?", "answer": "Forvitring er fysisk oppdeling eller kjemisk nedbryting av bergarter på stedet. Materialet trenger ikke å bli flyttet for at det skal være forvitring.", "example": "Vann som fryser i en sprekk, kan bidra til at stein løsner fra fjellet."}, {"id": "ytre-kort-02", "term": "Erosjon", "prompt": "Hva skiller erosjon fra forvitring?", "answer": "Ved erosjon blir materiale slitt løs og fjernet av for eksempel rennende vann, is eller vind. Forvitring bryter ned materialet der det ligger.", "example": "En bre kan slipe berggrunnen og frakte løsrevet materiale videre."}, {"id": "ytre-kort-03", "term": "Transport", "prompt": "Hva innebærer transport i landskapsformende prosesser?", "answer": "Løst materiale flyttes av blant annet vann, is, vind eller tyngdekraft. Hvor mye og hvor grovt materiale som kan flyttes, avhenger av transportprosessen og forholdene på stedet.", "example": "Ei elv med stor vannføring kan flytte grovere materiale enn den klarer ved lav vannføring."}, {"id": "ytre-kort-04", "term": "Avsetning", "prompt": "Når blir transportert materiale avsatt?", "answer": "Materiale avsettes når transporten ikke lenger klarer å føre det videre, eller når bæreren forsvinner, slik som ved issmelting. Avsetninger kan være sortert i ulike kornstørrelser eller bestå av en blanding.", "example": "En bekk kan legge igjen sand og grus der strømmen blir svakere."}, {"id": "ytre-kort-05", "term": "Breerosjon", "prompt": "Hvordan eroderer en isbre underlaget?", "answer": "Stein og grus i breen kan skure underlaget, og breen kan plukke løs blokker fra berggrunnen. Bevegelsen frakter materialet videre og kan over tid forme daler og fjorder.", "example": "En bred dal med bratte sider kan vise spor etter breerosjon."}, {"id": "ytre-kort-06", "term": "Elvelandskap", "prompt": "Hvordan former elver landskap?", "answer": "Elver eroderer, transporterer og avsetter materiale. Samspillet mellom vannføring, helning, berggrunn og løsmasser påvirker hvilke former som utvikles.", "example": "I en dal kan elva grave i bratte partier og avsette materiale på flatere strekninger."}, {"id": "ytre-kort-07", "term": "Løsmasser", "prompt": "Hva er løsmasser, og hvorfor betyr de noe for arealbruk?", "answer": "Løsmasser er løst materiale som ligger over berggrunnen, som leire, sand, grus og morenemateriale. Egenskapene påvirker blant annet jordbruk, drenering og stabilitet ved bygging.", "example": "Sand og grus avsatt av rennende vann kan brukes som byggeråstoff."}, {"id": "ytre-kort-08", "term": "Skred", "prompt": "Hva er et skred?", "answer": "Ved et skred beveger jord, stein, snø eller andre masser seg nedover på grunn av tyngdekraften. Utløsende forhold varierer, og kan blant annet være kraftig nedbør, erosjon eller endringer i stabilitet.", "example": "En bekk som eroderer nederst i en skråning, kan bidra til at massene mister støtte."}, {"id": "ytre-kort-09", "term": "Frostsprenging", "prompt": "Hvordan virker frostsprenging?", "answer": "Vann i sprekker kan fryse og utvide seg slik at trykket på berget øker. Gjentatte fryse- og tineprosesser kan bidra til å løsne stein.", "example": "Ura under en fjellvegg kan inneholde stein som har løsnet gjennom frostsprenging."}, {"id": "ytre-kort-10", "term": "U-dal og V-dal", "prompt": "Hva kan dalformen fortelle om landskapsutviklingen?", "answer": "En U-dal har vanligvis bred bunn og bratte sider og er ofte formet av breerosjon. En V-dal er vanligvis smalere og knyttet til elvas nedskjæring, men mange landskap er påvirket av flere prosesser.", "example": "En fjorddal kan ha U-form selv om ei elv nå renner i dalbunnen."}, {"id": "ytre-kort-11", "term": "Meander", "prompt": "Hvordan utvikles en meander?", "answer": "En meander er en elvesving der elva typisk eroderer i yttersvingen og avsetter materiale i innersvingen. Slik kan elveløpet flytte seg over tid.", "example": "På ei elveslette kan en avsnørt elvesving bli liggende igjen som en kroksjø."}, {"id": "ytre-kort-12", "term": "Delta", "prompt": "Hvordan dannes et elvedelta?", "answer": "Et delta kan dannes når ei elv avsetter materiale ved utløpet i en innsjø eller i havet. Oppbyggingen avhenger av sedimenttilførselen og hvor mye bølger og strøm fører bort.", "example": "Ei elv kan dele seg i flere løp gjennom materialet den har avsatt ved munningen."}]}, {"id": "klima", "title": "Klima og klimaendringer", "subtitle": "Forklar klimasystemet og vurder konsekvenser og tiltak.", "ndla": "https://ndla.no/nb/r/geografi/klima-hva-kan-du-na/7e847cc74f", "concepts": ["vær og klima", "klimasystemet", "drivhuseffekt", "klimagasser", "tilbakekobling", "utslippsreduksjon", "klimatilpasning", "sosial sårbarhet"], "goals": ["Forklare forskjellen på vær og klima og hvordan klimasystemet virker.", "Koble klimaendringer til følger for natur og samfunn på ulike geografiske nivåer.", "Drøfte utslippsreduksjon og klimatilpasning med konkrete eksempler."], "tasks": [{"id": "klima-1", "title": "Hvorfor endrer klimaet seg?", "prompt": "Forklar hvordan klimasystemet og drivhuseffekten virker. Gjør rede for hvordan menneskelig aktivitet kan endre klimaet. Vis hvordan du ville undersøkt en påstand om at en kald vinter motbeviser global oppvarming.", "focus": ["Vær og klima på ulike tids- og romskalaer", "Jordas energibalanse", "Naturlig og forsterket drivhuseffekt", "Utslipp og endret arealbruk", "Tolkning av tidsserier og kildekritikk"], "questions": [{"q": "Hva er forskjellen på vær og klima?", "cue": "Skill mellom enkelthendelser og statistiske mønstre over lengre tid.", "level": "Forklare"}, {"q": "Hvorfor er den naturlige drivhuseffekten viktig?", "cue": "Forklar innkommende solenergi og klimagassenes påvirkning på utgående varmestråling.", "level": "Forklare"}, {"q": "Hvordan kan smelting av snø og is forsterke oppvarming?", "cue": "Koble refleksjon av sollys til albedo og en positiv tilbakekobling.", "level": "Anvende"}, {"q": "Hva ville du undersøkt før du tolker en temperaturgraf?", "cue": "Kontroller område, periode, enhet, referanseperiode, kilde og variasjon.", "level": "Anvende"}, {"q": "Hvorfor kan en kald vinter forekomme samtidig med en langsiktig global oppvarming?", "cue": "Drøft lokal variasjon, tidsperiode og forskjellen på regionale og globale gjennomsnitt.", "level": "Drøfte"}], "bridge": {"q": "Hvordan henger endret arealbruk sammen med både klimautslipp og naturtap?", "cue": "Bruk for eksempel skog eller myr til å knytte karbonlagring til økosystemer og ressursbruk."}}, {"id": "klima-2", "title": "Mer styrtregn i nærmiljøet", "prompt": "En kommune vil forberede seg på kraftige regnskyll og oversvømmelser. Forklar hvordan nedbør, terreng og arealbruk kan påvirke konsekvensene. Drøft tiltak og hvordan kommunen kan prioritere mellom dem.", "focus": ["Forskjellen mellom nedbørhendelse og klimaendring", "Avrenning og tette flater", "Eksponering og sosial sårbarhet", "Blågrønne løsninger og tekniske tiltak", "Prioritering og usikkerhet"], "questions": [{"q": "Hva betyr klimatilpasning, og hvordan skiller det seg fra utslippsreduksjon?", "cue": "Forklar om tiltaket håndterer konsekvenser eller reduserer årsaken til oppvarming.", "level": "Forklare"}, {"q": "Hvorfor kan samme regnmengde gi ulike virkninger i skog og på en asfaltert plass?", "cue": "Koble infiltrasjon, lagring og overflateavrenning til arealdekket.", "level": "Anvende"}, {"q": "Hvordan ville du identifisert utsatte steder på et kart?", "cue": "Se etter lavpunkter, bekker, bratte områder, tette flater og viktige bygninger.", "level": "Anvende"}, {"q": "Hvem kan bli særlig sårbare når veier eller strømforsyning svikter?", "cue": "Vurder helse, mobilitet, økonomi og avhengighet av tjenester uten å redusere sårbarhet til én faktor.", "level": "Drøfte"}, {"q": "Bør kommunen prioritere større rør eller flere åpne vannveier og grøntområder?", "cue": "Sammenlign kapasitet, plass, kostnader, natur og virkninger nedstrøms.", "level": "Drøfte"}], "bridge": {"q": "Hvordan kan feltarbeid gi nyttig kunnskap om lokal overvannshåndtering?", "cue": "Planlegg registrering av overflater og vannveier, og vær tydelig om observasjonenes begrensninger."}}, {"id": "klima-3", "title": "Klimatiltak og rettferdig fordeling", "prompt": "Bruk transport, energibruk eller matforbruk som utgangspunkt for å drøfte klimatiltak. Forklar hvordan tiltak kan redusere utslipp, og hvem som kan få gevinster og kostnader. Sammenlign tiltak på individnivå og samfunnsnivå.", "focus": ["Utslippskilder og mulige tiltak", "Direkte utslipp og livsløpsperspektiv", "Tilgang til alternativer", "Fordeling av kostnader og gevinster", "Samspill mellom individ, teknologi og politikk"], "questions": [{"q": "Hvordan kan du undersøke om et tiltak faktisk reduserer utslipp?", "cue": "Angi hva det sammenlignes med og hvilke utslipp og tidsperioder som er tatt med.", "level": "Anvende"}, {"q": "Hva kan være forskjellen på utslipp i Norge og utslipp knyttet til norsk forbruk?", "cue": "Skill mellom hvor utslipp skjer, og hvilke varer og tjenester forbruket utløser.", "level": "Forklare"}, {"q": "Hvorfor kan bedre teknologi gi mindre utslippskutt enn forventet?", "cue": "Vurder om lavere pris eller økt effektivitet kan føre til høyere forbruk.", "level": "Anvende"}, {"q": "Hvordan kan et klimatiltak påvirke husholdninger forskjellig?", "cue": "Sammenlign inntekt, bosted, arbeid, behov og tilgang til alternativer.", "level": "Drøfte"}, {"q": "Hvordan kan individuelle valg og politiske tiltak støtte hverandre?", "cue": "Vurder infrastruktur, priser, regler og handlingsrommet til den enkelte.", "level": "Drøfte"}], "bridge": {"q": "Hvordan kan klimatiltak i ett land påvirke arbeid og ressursbruk i andre land?", "cue": "Koble forbruk og teknologi til globale verdikjeder og endret etterspørsel."}}], "cards": [{"id": "klima-kort-01", "term": "Vær og klima", "prompt": "Hva er forskjellen på vær og klima?", "answer": "Vær er tilstanden i atmosfæren på et bestemt sted og tidspunkt. Klima beskriver statistiske mønstre og variasjon i været over lang tid, så én kald dag sier lite om en langsiktig global utvikling.", "example": "Snøvær en dag i Oslo er vær, mens vanlige vinterforhold over lang tid beskriver klima."}, {"id": "klima-kort-02", "term": "Klimasystemet", "prompt": "Hvilke deler inngår i klimasystemet?", "answer": "Atmosfæren, havet, landjorda, is og snø og levende organismer inngår i klimasystemet. De utveksler blant annet energi, vann og karbon og påvirker hverandre.", "example": "Havet kan ta opp varme fra atmosfæren og transportere den videre med havstrømmer."}, {"id": "klima-kort-03", "term": "Drivhuseffekt", "prompt": "Hvordan virker drivhuseffekten?", "answer": "Klimagasser absorberer og sender ut varmestråling og gjør jordoverflaten varmere enn den ellers ville vært. Økte konsentrasjoner av klimagasser forsterker effekten og endrer jordas energibalanse.", "example": "CO₂ som tilføres atmosfæren ved forbrenning av fossilt brensel, bidrar til forsterket drivhuseffekt."}, {"id": "klima-kort-04", "term": "Klimagasser", "prompt": "Hva er klimagasser?", "answer": "Klimagasser er gasser som absorberer og sender ut varmestråling, blant annet vanndamp, karbondioksid og metan. Gassene har ulike kilder, levetider og virkninger i klimasystemet.", "example": "Metan kan slippes ut fra husdyrhold og ved lekkasjer fra fossil energiproduksjon."}, {"id": "klima-kort-05", "term": "Tilbakekobling", "prompt": "Hva er en tilbakekobling i klimasystemet?", "answer": "En endring kan utløse prosesser som igjen påvirker den opprinnelige endringen. En positiv tilbakekobling forsterker endringen, mens en negativ tilbakekobling demper den; ordene betyr ikke god eller dårlig.", "example": "Når snø smelter og mørkere underlag kommer fram, kan mer solenergi tas opp og oppvarmingen forsterkes."}, {"id": "klima-kort-06", "term": "Utslippsreduksjon", "prompt": "Hva er utslippsreduksjon?", "answer": "Utslippsreduksjon betyr å redusere mengden klimagasser som slippes ut. Det er viktig å vurdere den samlede virkningen og om utslipp bare flyttes til andre ledd eller steder.", "example": "Bedre isolasjon kan redusere energibehovet til oppvarming og utslippene knyttet til energibruken."}, {"id": "klima-kort-07", "term": "Klimatilpasning", "prompt": "Hva skiller klimatilpasning fra utslippsreduksjon?", "answer": "Klimatilpasning handler om å redusere sårbarhet og håndtere konsekvenser av et endret klima. Utslippsreduksjon retter seg mot årsakene til menneskeskapt oppvarming, og de to typene tiltak kan utfylle hverandre.", "example": "Å åpne en bekk og gi regnvann mer plass kan redusere oversvømmelser ved kraftige regnskyll."}, {"id": "klima-kort-08", "term": "Sosial sårbarhet", "prompt": "Hva menes med sosial sårbarhet ved ekstremvær?", "answer": "Sosial sårbarhet handler om hvor utsatt mennesker er for skade og hvilke muligheter de har til å forebygge, håndtere og komme seg etter en hendelse. Blant annet helse, inntekt, bolig, infrastruktur og tilgang til hjelp har betydning.", "example": "Et strømbrudd kan være særlig alvorlig for en person som er avhengig av elektrisk medisinsk utstyr."}, {"id": "klima-kort-09", "term": "Albedo", "prompt": "Hva er albedo, og hvorfor påvirker den klimaet?", "answer": "Albedo beskriver hvor stor del av solstrålingen en overflate reflekterer. Lyse flater som snø reflekterer vanligvis mer enn mørkt hav eller mørk jord, som tar opp mer energi.", "example": "Når havis forsvinner, kan det mørkere havet under ta opp mer av solenergien."}, {"id": "klima-kort-10", "term": "Karbonkretsløpet", "prompt": "Hvordan beveger karbon seg gjennom naturen?", "answer": "Karbon flyttes mellom atmosfæren, havet, levende organismer, jordsmonn og berggrunn gjennom ulike prosesser. Forbrenning av fossilt brensel tilfører atmosfæren karbon fra lagre som har vært bundet over lang tid.", "example": "Trær tar opp CO₂ i fotosyntesen, mens nedbryting og forbrenning kan føre karbon tilbake til atmosfæren."}, {"id": "klima-kort-11", "term": "Naturfare og risiko", "prompt": "Hvorfor er ikke naturfare og risiko det samme?", "answer": "Naturfare beskriver en mulig skadelig naturprosess eller hendelse. Risiko må også ses i sammenheng med hva som er eksponert, hvor sårbart det er, og hvilke konsekvenser hendelsen kan få.", "example": "Den samme flommen kan innebære ulik risiko i en ubebodd dal og i et tettsted med boliger langs elva."}, {"id": "klima-kort-12", "term": "Utslippsregnskap", "prompt": "Hva skiller territorielle utslipp fra forbruksbaserte utslipp?", "answer": "Territorielle utslipp regnes der utslippene fysisk skjer. Et forbruksbasert regnskap knytter utslipp gjennom produksjonskjeden til sluttforbruket, også når varene produseres i andre land.", "example": "Utslipp fra produksjonen av en importert jakke kan inngå i et norsk forbruksregnskap selv om produksjonen skjer i utlandet."}]}, {"id": "areal", "title": "Ressurser og arealbruk", "subtitle": "Vurder hvem som bruker naturen, og hvilke interesser som møtes.", "ndla": "https://ndla.no/nb/r/geografi/ressurser-og-arealbruk-hva-kan-du-na/d346ab4ebf", "concepts": ["naturressurs", "fornybar ressurs", "ikke-fornybar ressurs", "økosystemtjenester", "arealplanlegging", "interessekonflikt", "Sápmi", "nordområdene"], "goals": ["Forklare hvordan naturressurser gir muligheter og setter grenser for samfunn.", "Kartlegge ulike interesser i en konkret arealkonflikt, inkludert samiske interesser.", "Drøfte alternative løsninger og begrunne hvordan konsekvenser bør veies."], "tasks": [{"id": "areal-1", "title": "Vindkraft og reindrift", "prompt": "Et tenkt vindkraftanlegg planlegges i et område som brukes til reindrift og friluftsliv. Gjør rede for interessene som kan komme i konflikt. Drøft hva som bør undersøkes, og hvordan en beslutning kan ta hensyn til energi, natur og samisk kulturutøvelse.", "focus": ["Energi og lokalisering", "Reindriftens bruk av sammenhengende arealer", "Natur og friluftsliv", "Samiske interesser, rettigheter og medvirkning", "Alternativer og samlede belastninger"], "questions": [{"q": "Hva er en arealkonflikt, og hvem er berørt i denne saken?", "cue": "Skill mellom ulike parter og hva hver av dem trenger arealet til.", "level": "Forklare"}, {"q": "Hvorfor kan et inngrep få betydning utover selve anleggsområdet?", "cue": "Tenk på veier, forbindelser mellom beiteområder, ferdsel og samlet belastning.", "level": "Anvende"}, {"q": "Hva ville du tegnet inn på et kart for å belyse konflikten?", "cue": "Ta med planlagt inngrep, eksisterende bruk, naturverdier og mulige alternative plasseringer.", "level": "Anvende"}, {"q": "Hvorfor kan ikke alle hensyn i saken reduseres til en pris?", "cue": "Drøft kultur, rettigheter, naturverdier og langsiktige livsgrunnlag sammen med økonomi.", "level": "Drøfte"}, {"q": "Hvordan ville du begrunnet en anbefaling uten å late som konflikten har en enkel fasit?", "cue": "Vis alternativer, kunnskapsbehov, hvem som berøres og hvilke hensyn du vektlegger.", "level": "Drøfte"}], "bridge": {"q": "Hvordan kan klimatiltak skape nye bærekraftsdilemmaer?", "cue": "Koble energiprosjektet til miljømessige, økonomiske og sosiale virkninger på ulike nivåer."}}, {"id": "areal-2", "title": "Matjord eller nye boliger?", "prompt": "En kommune vurderer å bygge boliger og vei på jordbruksareal nær sentrum. Forklar hvorfor arealet er attraktivt for flere formål. Drøft alternativer og hvilke konsekvenser som bør telle i beslutningen.", "focus": ["Areal som begrenset ressurs", "Matproduksjon og jordvern", "Boligbehov og transport", "Fortetting og andre lokaliseringer", "Kortsiktige og langsiktige konsekvenser"], "questions": [{"q": "Hvorfor er jordbruksjord en ressurs det kan være vanskelig å erstatte?", "cue": "Vurder jordkvalitet, beliggenhet, klima og tiden det tar å utvikle jord.", "level": "Forklare"}, {"q": "Hvilke opplysninger trenger du for å vurdere boligbehovet?", "cue": "Se etter befolkningsutvikling, boligtyper, ledig kapasitet og eksisterende planer.", "level": "Anvende"}, {"q": "Hvordan kan lokaliseringen av boligene påvirke transport og utslipp?", "cue": "Koble avstander og tilgjengelige reisemåter til hverdagsreiser.", "level": "Anvende"}, {"q": "Hvilke fordeler og ulemper kan fortetting ha?", "cue": "Vei arealsparing og korte avstander mot bomiljø, grøntområder, pris og kapasitet.", "level": "Drøfte"}, {"q": "Hvordan bør kommunen ta hensyn til framtidige generasjoner?", "cue": "Drøft irreversible inngrep, framtidig matproduksjon og usikkerhet om behov.", "level": "Drøfte"}], "bridge": {"q": "Hvordan kan demografiske endringer påvirke hvilke boliger kommunen trenger?", "cue": "Koble alder, husholdningsstørrelse og migrasjon til boligtyper og tjenestebehov."}}, {"id": "areal-3", "title": "Ressursbruk i nordområdene", "prompt": "Velg fiskeri, havbruk, mineraler eller energi som utgangspunkt for å undersøke ressursbruk i nordområdene. Forklar hvordan naturgrunnlaget gir muligheter for næringsliv og bosetting. Drøft hvordan ulike interesser og miljøhensyn kan ivaretas.", "focus": ["Naturgrunnlag og valgt ressurs", "Arbeidsplasser og bosetting", "Fornybarhet og forvaltningsbehov", "Ulike næringer og samiske interesser", "Miljøbelastning og langsiktig ressursbruk"], "questions": [{"q": "Hvordan påvirker naturgrunnlaget hvor den valgte næringen finnes?", "cue": "Bruk relevante forhold som hav, klima, berggrunn, terreng eller biologiske ressurser.", "level": "Forklare"}, {"q": "Hva avgjør om en fornybar ressurs brukes bærekraftig?", "cue": "Skill mellom at ressursen kan fornyes og at uttaket faktisk er tilpasset fornyelsen.", "level": "Forklare"}, {"q": "Hvordan kan ressursnæringen påvirke et lokalsamfunn?", "cue": "Vurder arbeidsplasser, inntekter, kompetanse, tjenester og avhengighet av én næring.", "level": "Anvende"}, {"q": "Hvilke andre brukere av området må tas med i vurderingen?", "cue": "Velg relevante interesser for eksemplet, og undersøk samiske interesser der de berøres.", "level": "Drøfte"}, {"q": "Hvordan kan kommunen og nasjonale myndigheter ha ulike prioriteringer?", "cue": "Sammenlign lokal verdiskaping med langsiktig forvaltning og virkninger på større geografiske nivåer.", "level": "Drøfte"}], "bridge": {"q": "Hvordan kan endret klima påvirke ressursgrunnlaget og næringen du valgte?", "cue": "Forklar mulige mekanismer, og skill mellom dokumenterte endringer, forventninger og usikkerhet."}}], "cards": [{"id": "areal-kort-01", "term": "Naturressurs", "prompt": "Hva er en naturressurs?", "answer": "En naturressurs er materiale, energi eller andre forhold i naturen som mennesker kan ha nytte av. Hva som regnes som en utnyttbar ressurs, påvirkes også av kunnskap, teknologi, behov og økonomi.", "example": "Rennende vann kan brukes til kraftproduksjon der naturforhold og tekniske løsninger gjør det mulig."}, {"id": "areal-kort-02", "term": "Fornybar ressurs", "prompt": "Hva betyr det at en ressurs er fornybar?", "answer": "Ressursen fornyes gjennom naturlige prosesser på en tidsskala som er relevant for mennesker. Fornybar betyr ikke ubegrenset: for eksempel må uttak av fisk og skog tilpasses fornyelsen og økosystemet.", "example": "En fiskebestand kan svekkes hvis uttaket over tid er større enn bestanden tåler."}, {"id": "areal-kort-03", "term": "Ikke-fornybar ressurs", "prompt": "Hva er en ikke-fornybar ressurs?", "answer": "Den finnes i begrensede forekomster og dannes så langsomt at uttak ikke erstattes på menneskelig tidsskala. Noen materialer kan ombrukes eller gjenvinnes, uten at selve forekomsten dermed blir fornybar.", "example": "Kobber kan materialgjenvinnes selv om kobberforekomsten i berggrunnen er ikke-fornybar."}, {"id": "areal-kort-04", "term": "Økosystemtjenester", "prompt": "Hva er økosystemtjenester?", "answer": "Økosystemtjenester er goder og funksjoner fra økosystemer som mennesker har nytte av. De omfatter blant annet mat og råvarer, regulering av vann og klima og muligheter for opplevelser.", "example": "Vegetasjon kan bremse avrenning, gi leveområder og gjøre et nærmiljø godt å oppholde seg i."}, {"id": "areal-kort-05", "term": "Arealplanlegging", "prompt": "Hva skal arealplanlegging bidra til?", "answer": "Arealplanlegging styrer hvor og hvordan arealer kan brukes, og må samordne ulike behov og hensyn. Naturfare, naturverdier, boliger, næringsliv, transport og eksisterende bruk er relevante forhold.", "example": "En kommune kan styre ny boligbygging bort fra flomutsatte områder og viktige jordbruksarealer."}, {"id": "areal-kort-06", "term": "Interessekonflikt", "prompt": "Hvordan undersøker du en interessekonflikt om areal?", "answer": "Kartlegg hvem som berøres, hva de ønsker, og hvilke verdier, behov eller rettigheter som står på spill. Vurder dokumentasjon, alternative løsninger og hvordan gevinster og belastninger fordeles.", "example": "En ny vei kan gi kortere reisetid og samtidig berøre matjord, natur og naboer."}, {"id": "areal-kort-07", "term": "Sápmi", "prompt": "Hva er Sápmi, og hvorfor er det relevant for arealbruk?", "answer": "Sápmi er samenes tradisjonelle bosettingsområde og strekker seg over deler av Norge, Sverige, Finland og Russland. Arealbruk kan berøre samiske næringer, kulturutøvelse og livsgrunnlag, men interessene må undersøkes konkret i hver sak.", "example": "En planlagt utbygging kan berøre forbindelsen mellom ulike beiteområder som brukes i reindrift."}, {"id": "areal-kort-08", "term": "Nordområdene", "prompt": "Hva mener vi med nordområdene i geografi?", "answer": "Nordområdene er en betegnelse på land- og havområder i nord, med en avgrensning som varierer med sammenhengen. Ressurser, bosetting, samiske interesser, klima og miljø er sentrale geografiske temaer.", "example": "En undersøkelse av fiskeri i nord kan koble havets ressurser til arbeidsplasser og langsiktig forvaltning."}, {"id": "areal-kort-09", "term": "Samlet belastning", "prompt": "Hvorfor bør flere inngrep vurderes samlet?", "answer": "Flere inngrep kan sammen få større betydning enn hvert inngrep sett for seg. Vurderingen må se på forbindelser mellom områder, tidligere påvirkning og hvilke funksjoner som kan gå tapt.", "example": "En vei, et kraftanlegg og nye hytter kan samlet dele opp et sammenhengende naturområde."}, {"id": "areal-kort-10", "term": "Fornybar og bærekraftig", "prompt": "Hvorfor er ikke fornybar ressursbruk automatisk bærekraftig?", "answer": "Fornybarhet beskriver ressursens evne til å fornyes, mens bærekraft også handler om virkninger for natur, mennesker og økonomi. Både uttak, lokalisering og følgeinngrep må vurderes.", "example": "Et vannkraftprosjekt kan bruke en fornybar energikilde og samtidig endre levevilkårene i ei elv."}, {"id": "areal-kort-11", "term": "Naturfarekart", "prompt": "Kan ett kart alene avgjøre om en tomt er trygg?", "answer": "Kart gir viktig informasjon, men må tolkes ut fra karttype, målestokk og datagrunnlag. Et aktsomhetsområde peker på mulige fareforhold og kan vise behov for mer detaljerte faglige undersøkelser.", "example": "Et oversiktskart som viser mulig skredfare, erstatter ikke en faglig vurdering av den aktuelle tomta."}, {"id": "areal-kort-12", "term": "Alternativer og lokalisering", "prompt": "Hvorfor må alternative plasseringer tas med i en arealvurdering?", "answer": "En utbyggings konsekvenser avhenger av hvor og hvordan den gjennomføres. Å sammenligne plasseringer, utforming og muligheten for å dekke behovet på andre måter gjør prioriteringen mer begrunnet.", "example": "Nye boliger kan sammenlignes som fortetting på et utbygd areal eller som utbygging på matjord."}]}, {"id": "demografi", "title": "Demografi og levekår", "subtitle": "Forstå befolkningsendringer og forskjeller i livsvilkår.", "ndla": "https://ndla.no/nb/r/geografi/demografi-og-levekar-hva-kan-du-na/e7f14cbb6a", "concepts": ["fødselsrate", "dødsrate", "naturlig tilvekst", "nettomigrasjon", "demografisk overgang", "befolkningspyramide", "HDI", "levekår"], "goals": ["Forklare hvordan fødsler, dødsfall og migrasjon endrer en befolkning.", "Bruke befolkningspyramider og overgangsmodellen til å undersøke et samfunn.", "Sammenligne levekår med flere indikatorer og drøfte årsaker til forskjeller."], "tasks": [{"id": "demografi-1", "title": "En befolkning i endring", "prompt": "Velg to land med ulik befolkningssammensetning og finn en befolkningspyramide for hvert land. Forklar forskjellene ved hjelp av den demografiske overgangsmodellen, og drøft hvilke utfordringer og muligheter aldersfordelingen kan gi.", "focus": ["Fødselsrate, dødsrate og naturlig tilvekst", "Pyramidenes form, årstall og datagrunnlag", "Modellens faser og begrensninger", "Utdanning, arbeidsliv, helse og forsørging", "Migrasjon som del av forklaringen"], "questions": [{"q": "Hva er forskjellen på naturlig tilvekst og samlet befolkningsvekst?", "cue": "Fødsler minus dødsfall; ta deretter med innvandring og utvandring.", "level": "Forklare"}, {"q": "Hvorfor synker dødsraten ofte før fødselsraten i overgangsmodellen?", "cue": "Mat, rent vann og helsetjenester; endringer i familieøkonomi og livsvalg kan ta lengre tid.", "level": "Forklare"}, {"q": "Hva i befolkningspyramiden din tyder på en ung eller aldrende befolkning?", "cue": "Bredde på årskull, grunnflate og øvre aldersgrupper; skill observasjon fra forklaring.", "level": "Anvende"}, {"q": "Er en stor ung befolkning først og fremst en ressurs eller en utfordring?", "cue": "Arbeidsplasser, utdanning og helse; mulige gevinster avhenger av samfunnsforhold.", "level": "Drøfte"}, {"q": "Hvor godt kan overgangsmodellen forutsi utviklingen i landene du valgte?", "cue": "Forenklet modell; migrasjon, politikk, kriser og ulike historiske forløp.", "level": "Drøfte"}], "bridge": {"q": "Hvordan kan klimaendringer og naturhendelser påvirke befolkningsutviklingen?", "cue": "Helse, matproduksjon og flytting; virkninger avhenger av sårbarhet og tiltak."}}, {"id": "demografi-2", "title": "Hva betyr gode levekår?", "prompt": "Sammenlign levekårene i to land ved hjelp av minst tre relevante indikatorer. Forklar mulige årsaker til forskjellene, og vurder hva indikatorene viser og hva de ikke fanger opp.", "focus": ["Inntekt, utdanning og forventet levealder", "HDI og økonomiske indikatorer", "Fordeling og forskjeller innad i land", "Historiske, politiske og geografiske forklaringer", "Kildenes årstall og sammenlignbarhet"], "questions": [{"q": "Hvorfor er inntekt alene et utilstrekkelig mål på levekår?", "cue": "Fordeling, helse, utdanning, trygghet og miljø; et gjennomsnitt skjuler variasjon.", "level": "Forklare"}, {"q": "Hva måler HDI, og hvilke sider av et samfunn faller utenfor?", "cue": "Helse, utdanning og inntekt; undersøk om rettigheter, ulikhet og miljø dekkes.", "level": "Forklare"}, {"q": "Hvilken av indikatorene du valgte gir mest nyttig informasjon om forskjellen mellom landene?", "cue": "Vis til konkrete data med årstall; begrunn hvorfor indikatoren passer spørsmålet.", "level": "Anvende"}, {"q": "Hvordan kan to land med omtrent samme inntekt ha ulike levekår?", "cue": "Fordeling, offentlige tjenester, ressursforvaltning og politiske prioriteringer.", "level": "Drøfte"}, {"q": "Hvilke tiltak ville du prioritert for bedre levekår i ett av landene?", "cue": "Vurder behov, finansiering, lokale forutsetninger, målkonflikter og tidshorisont.", "level": "Drøfte"}], "bridge": {"q": "Hvordan kan en global produksjonskjede påvirke levekårene i et produksjonsland?", "cue": "Arbeidsplasser og inntekt; arbeidsvilkår, skatteinntekter, miljøbelastning og fordeling."}}, {"id": "demografi-3", "title": "Hvorfor flytter mennesker?", "prompt": "Velg et eksempel på flytting mellom land eller fra bygd til by. Forklar årsakene til flyttingen og drøft konsekvenser både for stedet mennesker forlater og stedet de flytter til.", "focus": ["Skyvefaktorer og drafaktorer", "Frivillig og tvungen migrasjon", "Arbeid, utdanning og familie", "Virkninger for avsender- og mottakerområder", "Forskjeller mellom personer og over tid"], "questions": [{"q": "Hva er forskjellen på en skyvefaktor og en drafaktor?", "cue": "Forhold som bidrar til at noen forlater et sted, og forhold som trekker mot et annet.", "level": "Forklare"}, {"q": "Hvorfor kan migrasjon sjelden forklares med én årsak?", "cue": "Arbeid, familie, sikkerhet, nettverk og muligheten til faktisk å flytte.", "level": "Forklare"}, {"q": "Hvilke faktorer er viktigst i eksemplet ditt, og hvordan vet du det?", "cue": "Bruk dokumentasjon; skill egne antakelser fra det kilden faktisk viser.", "level": "Anvende"}, {"q": "Hvordan kan utflytting gi både fordeler og ulemper for et lokalsamfunn?", "cue": "Pengeoverføringer, kompetansetap, aldersfordeling, nye nettverk og mulig tilbakeflytting.", "level": "Drøfte"}, {"q": "Hva avgjør om sterk tilflytting blir håndtert på en god måte?", "cue": "Boliger, transport, vann, skole, arbeid og planlegging; vurder ulike grupper.", "level": "Drøfte"}], "bridge": {"q": "Hvilke arealkonflikter kan oppstå når en by vokser?", "cue": "Boligbygging, matjord, natur, transport og grønne områder; hvem får nytte og belastninger?"}}], "cards": [{"id": "demografi-kort-01", "term": "Fødselsrate", "prompt": "Hva viser fødselsraten?", "answer": "Fødselsraten er antall levendefødte per 1 000 innbyggere i løpet av ett år. En rate gjør det lettere å sammenligne befolkninger av ulik størrelse.", "example": "To land kan ha like mange fødsler, men ulik fødselsrate fordi folketallet er forskjellig."}, {"id": "demografi-kort-02", "term": "Dødsrate", "prompt": "Hvorfor forteller ikke dødsraten alene hvor gode helsetjenestene er?", "answer": "Dødsraten er antall døde per 1 000 innbyggere i løpet av ett år. Alderssammensetningen påvirker raten, så en høy andel eldre kan gi relativt høy dødsrate også der helsetjenestene er gode.", "example": "Et land med mange eldre kan ha høyere dødsrate enn et land med svært ung befolkning."}, {"id": "demografi-kort-03", "term": "Naturlig tilvekst", "prompt": "Hvordan beregner du naturlig tilvekst?", "answer": "Naturlig tilvekst er antall fødte minus antall døde i en periode. Bruker du fødselsrate minus dødsrate, får du den naturlige tilvekstraten; migrasjon er ikke med.", "example": "I et område med flere dødsfall enn fødsler er den naturlige tilveksten negativ."}, {"id": "demografi-kort-04", "term": "Nettomigrasjon", "prompt": "Hva er nettomigrasjon, og hvordan påvirker den folketallet?", "answer": "Nettomigrasjon er antall innflyttere minus antall utflyttere i en periode. Samlet befolkningsendring får du ved å legge nettomigrasjonen til den naturlige tilveksten.", "example": "En kommune kan få flere innbyggere gjennom innflytting selv om det fødes færre enn det dør."}, {"id": "demografi-kort-05", "term": "Demografisk overgang", "prompt": "Hva forklarer den demografiske overgangsmodellen?", "answer": "Modellen beskriver overgangen fra høye fødsels- og dødsrater til lave rater. Når dødsraten synker før fødselsraten, kan befolkningen vokse raskt; modellen forenkler utviklingen og fanger ikke alle forløp.", "example": "Bedre tilgang til rent vann kan redusere dødeligheten før familievaner og fødselstall endrer seg."}, {"id": "demografi-kort-06", "term": "Befolkningspyramide", "prompt": "Hva kan du lese ut av en befolkningspyramide?", "answer": "En befolkningspyramide viser alders- og kjønnsfordelingen i en befolkning på et bestemt tidspunkt. Formen kan si noe om behov for tjenester og mulige demografiske prosesser, men årsakene må undersøkes med flere kilder.", "example": "Store barnekull kan tyde på at et område vil trenge flere skoleplasser."}, {"id": "demografi-kort-07", "term": "HDI", "prompt": "Hva måler HDI, og hva kan indikatoren skjule?", "answer": "HDI sammenfatter forventet levealder, utdanning og inntekt per innbygger i én indeks. Landsgjennomsnittet viser ikke alle forskjeller innad i landet og dekker ikke alle sider ved levekår, som trygghet og miljø.", "example": "Et land med høy HDI kan fortsatt ha store forskjeller mellom regioner og inntektsgrupper."}, {"id": "demografi-kort-08", "term": "Levekår", "prompt": "Hvorfor bør levekår beskrives med flere indikatorer?", "answer": "Levekår omfatter forhold som påvirker menneskers livsmuligheter, blant annet inntekt, helse, utdanning, bolig og trygghet. Flere indikatorer gir et bredere bilde enn ett økonomisk mål alene.", "example": "Tilgang til skole og rent drikkevann kan vise viktige levekårsforskjeller som inntekt alene ikke forklarer."}, {"id": "demografi-kort-09", "term": "BNP og HDI", "prompt": "Hva er forskjellen på BNP og HDI som mål på utvikling?", "answer": "BNP måler samlet verdiskaping i et land i en periode, mens HDI kombinerer helse, utdanning og inntekt. BNP per innbygger justerer for folketall, men viser ikke hvordan inntektene fordeles.", "example": "To land med omtrent likt BNP per innbygger kan ha ulik forventet levealder og skolegang."}, {"id": "demografi-kort-10", "term": "Migrasjon", "prompt": "Hva betyr migrasjon, og hvilke former kan den ha?", "answer": "Migrasjon er flytting mellom steder, enten innenfor et land eller over landegrenser. Flyttingen kan være midlertidig eller varig og skyldes flere forhold, som arbeid, familie, utdanning eller utrygghet.", "example": "En ungdom som flytter fra hjemkommunen til en studieby, er del av innenlandsk migrasjon."}, {"id": "demografi-kort-11", "term": "Skyvefaktorer og drafaktorer", "prompt": "Hvordan skiller du mellom skyve- og drafaktorer?", "answer": "Skyvefaktorer er forhold som bidrar til at mennesker forlater et sted, mens drafaktorer gjør et annet sted attraktivt. Faktorene virker ofte sammen, og muligheten til å flytte avhenger også av penger, rettigheter og nettverk.", "example": "Mangel på arbeid kan skyve noen fra hjemstedet, mens et jobbtilbud trekker mot en annen by."}, {"id": "demografi-kort-12", "term": "Antall og rate", "prompt": "Hvorfor må du skille mellom antall fødsler og fødselsrate?", "answer": "Et antall viser hvor mange hendelser som har skjedd, mens en rate setter hendelsene i forhold til størrelsen på befolkningen. Antall er nyttig for å planlegge kapasitet, mens rater ofte passer bedre til sammenligning.", "example": "Et stort land kan ha flere fødsler enn et lite land selv om fødselsraten er lavere."}]}, {"id": "forbruk", "title": "Forbruk og ressursbruk", "subtitle": "Se egne valg i sammenheng med natur, økonomi og levekår.", "ndla": "https://ndla.no/nb/r/geografi/forbruk-hva-kan-du-na/bc10bd11ae", "concepts": ["ressursbruk", "livsløp", "klimaavtrykk", "økologisk fotavtrykk", "sirkulær økonomi", "ombruk", "materialgjenvinning", "rekyleffekt"], "goals": ["Undersøke et produkts ressursbruk gjennom hele livsløpet.", "Reflektere over eget og norsk forbruk i et globalt perspektiv.", "Drøfte tiltak som reduserer ressursbruk og vurdere hvem som kan påvirke."], "tasks": [{"id": "forbruk-1", "title": "Mobilens vei fra gruve til skuff", "prompt": "Undersøk livsløpet til en mobiltelefon eller et annet produkt du bruker. Forklar hvordan råvareuttak, produksjon, transport, bruk og avfall påvirker natur og samfunn, og drøft hvordan belastningen kan reduseres.", "focus": ["Råvarer og energi i ulike ledd", "Arbeidsforhold og lokal miljøbelastning", "Levetid, reparasjon og ombruk", "Avfall og materialgjenvinning", "Ansvar hos forbrukere, bedrifter og myndigheter"], "questions": [{"q": "Hva vil det si å undersøke et produkts livsløp?", "cue": "Se flere ledd fra råvareuttak til avfall; unngå å vurdere bare bruken.", "level": "Forklare"}, {"q": "Hva er forskjellen på ombruk og materialgjenvinning?", "cue": "Produktet brukes videre; materialene bearbeides til nye råvarer.", "level": "Forklare"}, {"q": "Hvilke ledd i produktets livsløp bør du undersøke nærmere før du foreslår tiltak?", "cue": "Finn dokumentasjon om materialer, energi, levetid og avfall; ikke gjett hvilke ledd som er størst.", "level": "Anvende"}, {"q": "Når kan det være bedre å reparere enn å kjøpe nytt?", "cue": "Gjenværende levetid, energibruk, reservedeler, kostnad og belastning ved ny produksjon.", "level": "Drøfte"}, {"q": "Hvem har størst mulighet til å gjøre dette produktet mer bærekraftig?", "cue": "Vurder design, regelverk, innkjøp og bruk; ulike aktører påvirker ulike ledd.", "level": "Drøfte"}], "bridge": {"q": "Hvorfor ligger råvareuttak, produksjon og salg ofte i forskjellige land?", "cue": "Ressurser, energi, arbeidskraft, transport, marked og politiske rammer."}}, {"id": "forbruk-2", "title": "Norsk forbruk i en felles verden", "prompt": "Ta utgangspunkt i klær, mat eller reiser i din egen hverdag. Drøft hvordan forbruket henger sammen med global ressursbruk og vurder tiltak på individ-, bedrifts- og samfunnsnivå.", "focus": ["Konkrete forbruksvalg og behov", "Direkte og indirekte ressursbruk", "Forbrukets belastninger på andre steder", "Økonomiske og sosiale vilkår for å endre valg", "Tiltak på flere geografiske nivåer"], "questions": [{"q": "Hvordan kan en vare kjøpt i Norge gi miljøbelastning i et annet land?", "cue": "Se på råvarer, produksjon, energi, transport og avfall.", "level": "Forklare"}, {"q": "Hva er forskjellen på å redusere forbruk og å bytte til et annet produkt?", "cue": "Mengde og behov sammenlignet med produktvalg; ny produksjon krever også ressurser.", "level": "Forklare"}, {"q": "Velg ett forbruksvalg du kan endre: Hvilke virkninger vil du undersøke?", "cue": "Ressursbruk, økonomi, tidsbruk og sosiale forhold; sammenlign et tydelig alternativ.", "level": "Anvende"}, {"q": "Er det rettferdig å stille de samme kravene til alle forbrukere?", "cue": "Inntekt, bosted, transporttilbud, helse og tilgang til alternativer.", "level": "Drøfte"}, {"q": "Hvilke samfunnstiltak kan gjøre bærekraftige valg enklere?", "cue": "Infrastruktur, produktkrav, avgifter, tjenester og informasjon; vurder fordelingseffekter.", "level": "Drøfte"}], "bridge": {"q": "Hvordan kan redusert norsk forbruk påvirke arbeidsplasser i andre land?", "cue": "Etterspørsel, inntekter og omstilling; drøft både kort og lang sikt."}}, {"id": "forbruk-3", "title": "Kan forbruket bli sirkulært?", "prompt": "Velg klær, elektronikk eller byggematerialer og forklar hvordan ressursene brukes i dag. Foreslå en mer sirkulær løsning, og drøft både muligheter, begrensninger og mulige målkonflikter.", "focus": ["Lineær og sirkulær ressursbruk", "Forebygging, levetid, reparasjon og ombruk", "Materialgjenvinning og materialtap", "Økonomi, produktdesign og organisering", "Rekyleffekt og samlet forbruk"], "questions": [{"q": "Hva kjennetegner en lineær og en sirkulær økonomi?", "cue": "Uttak–produksjon–avfall sammenlignet med lengre bruk og kretsløp for materialer.", "level": "Forklare"}, {"q": "Hvorfor gjør ikke gjenvinning et produkt automatisk bærekraftig?", "cue": "Innsamling, materialkvalitet, energibruk, tap og hvor mye som produseres.", "level": "Forklare"}, {"q": "Hvordan vil du endre produktet eller tjenesten du valgte?", "cue": "Beskriv et konkret tiltak og hvilke ledd i ressursbruken det påvirker.", "level": "Anvende"}, {"q": "Kan en mer effektiv løsning føre til at vi bruker mer totalt?", "cue": "Lavere pris eller enklere tilgang kan øke etterspørselen; vurder rekyleffekt.", "level": "Drøfte"}, {"q": "Hva skal til for at løsningen din blir brukt av mange?", "cue": "Pris, tilgjengelighet, kvalitet, vaner, regelverk og ansvar for vedlikehold.", "level": "Drøfte"}], "bridge": {"q": "Kan større etterspørsel etter gjenvunne materialer redusere arealkonflikter?", "cue": "Mulig redusert behov for uttak; vurder nye anlegg, transport og samlet materialbehov."}}], "cards": [{"id": "forbruk-kort-01", "term": "Ressursbruk", "prompt": "Hva bør være med når du undersøker ressursbruken til en vare?", "answer": "Ressursbruk omfatter blant annet materialer, energi, vann og arealer som trengs gjennom varens livsløp. Undersøk både det forbrukeren bruker direkte, og ressursene som går med andre steder i produksjonen.", "example": "En bomullsgenser krever ressurser både til dyrking, tekstilproduksjon, transport og vask."}, {"id": "forbruk-kort-02", "term": "Livsløp", "prompt": "Hva betyr det å se et produkt i et livsløpsperspektiv?", "answer": "Du følger produktet fra råvareuttak gjennom produksjon, transport og bruk til ombruk, gjenvinning eller avfall. Perspektivet hjelper deg å oppdage om et tiltak reduserer belastningen totalt eller bare flytter den mellom ledd.", "example": "Når en telefon vurderes, bør også utvinning av metaller og behandling av avfallet undersøkes."}, {"id": "forbruk-kort-03", "term": "Klimaavtrykk", "prompt": "Hva viser et klimaavtrykk, og hva viser det ikke?", "answer": "Klimaavtrykket uttrykker klimagassutslipp knyttet til en aktivitet, person eller vare, vanligvis omregnet til CO₂-ekvivalenter. Det måler ikke alle miljøvirkninger, og resultatet avhenger av hvilke ledd beregningen omfatter.", "example": "Et klesplaggs klimaavtrykk forteller ikke alene hvor mye lokal vannforurensning produksjonen har gitt."}, {"id": "forbruk-kort-04", "term": "Økologisk fotavtrykk", "prompt": "Hvordan skiller økologisk fotavtrykk seg fra klimaavtrykk?", "answer": "Økologisk fotavtrykk anslår det biologisk produktive arealet som trengs for å støtte et forbruk og håndtere deler av belastningen, blant annet CO₂-utslipp. Klimaavtrykket uttrykker derimot klimagassutslipp som en mengde CO₂-ekvivalenter; ingen av målene gir et fullstendig bilde av bærekraft.", "example": "En endring i kosthold kan påvirke både behovet for jordbruksareal og utslippene fra matproduksjonen."}, {"id": "forbruk-kort-05", "term": "Sirkulær økonomi", "prompt": "Hva er målet med en sirkulær økonomi?", "answer": "Målet er å redusere uttak av nye ressurser og avfall ved å holde produkter og materialer i bruk så lenge som mulig. Lang levetid, reparasjon, ombruk og gjenvinning er viktige virkemidler, men kretsløpene krever også ressurser og energi.", "example": "Et utleiesystem kan la flere bruke samme verktøy i stedet for at alle kjøper hvert sitt."}, {"id": "forbruk-kort-06", "term": "Ombruk", "prompt": "Hva betyr ombruk?", "answer": "Ombruk betyr at et produkt brukes igjen uten først å bli brutt ned til nye råvarer. Det kan forlenge levetiden og redusere behovet for ny produksjon, men effekten avhenger blant annet av transport og om det faktisk erstatter et nykjøp.", "example": "Når en brukt stol selges videre og brukes som stol igjen, er det ombruk."}, {"id": "forbruk-kort-07", "term": "Materialgjenvinning", "prompt": "Hvordan skiller materialgjenvinning seg fra ombruk?", "answer": "Ved materialgjenvinning bearbeides avfall slik at materialene kan brukes som råstoff i nye produkter. Ved ombruk brukes produktet videre; gjenvinning innebærer ofte mer bearbeiding og kan gi materialtap.", "example": "En aluminiumsboks som smeltes om til materiale for et nytt produkt, materialgjenvinnes."}, {"id": "forbruk-kort-08", "term": "Rekyleffekt", "prompt": "Hvordan kan effektivisering gi mindre miljøgevinst enn forventet?", "answer": "En rekyleffekt oppstår når effektivisering gjør en aktivitet billigere eller enklere, slik at bruken øker og spiser opp noe av gevinsten. Derfor må du undersøke samlet forbruk, ikke bare ressursbruken per enhet.", "example": "En bil som bruker mindre drivstoff per kilometer kan gi mindre gevinst dersom eieren begynner å kjøre mer."}, {"id": "forbruk-kort-09", "term": "Lineær økonomi", "prompt": "Hva kjennetegner en lineær økonomi?", "answer": "En lineær økonomi beskrives ofte som å hente ut råvarer, produsere, bruke og kaste. Produkter og materialer går i liten grad tilbake i bruk, slik at ny produksjon stadig trenger nye ressurser.", "example": "Et engangsprodukt som lages av nye råvarer og kastes etter kort bruk, illustrerer lineær ressursbruk."}, {"id": "forbruk-kort-10", "term": "Levetid og reparasjon", "prompt": "Hvorfor kan lengre levetid redusere ressursbruken?", "answer": "Når et produkt varer lenger og erstatter behovet for et nytt, kan belastningen fra ny produksjon unngås eller utsettes. Reparasjon bør likevel vurderes sammen med ressursbehov, energibruk og hvor lenge produktet kan brukes videre.", "example": "Et nytt batteri kan gjøre at en ellers fungerende telefon brukes i flere år til."}, {"id": "forbruk-kort-11", "term": "Direkte og indirekte ressursbruk", "prompt": "Hva er forskjellen på direkte og indirekte ressursbruk i hverdagen?", "answer": "Direkte ressursbruk er det du selv bruker, som strøm hjemme eller vann fra springen. Indirekte ressursbruk skjer gjennom produksjonen av varene og tjenestene du kjøper, ofte andre steder i verden.", "example": "Vannet du bruker til å vaske en genser er direkte bruk, mens vann brukt i bomullsdyrkingen er indirekte."}, {"id": "forbruk-kort-12", "term": "Ansvar og handlingsrom", "prompt": "Hvorfor må bærekraftig forbruk drøftes på flere nivåer?", "answer": "Forbrukere, bedrifter og myndigheter påvirker ulike deler av ressursbruken. Valg av produkter betyr noe, men pris, produktdesign, infrastruktur og regler avgjør hvilke valg som er praktisk mulige.", "example": "En innbygger kan ønske å reise kollektivt, men er avhengig av at det finnes et egnet transporttilbud."}]}, {"id": "globalisering", "title": "Globalisering og lokalisering", "subtitle": "Undersøk hvorfor virksomheter ligger der de gjør, og hvordan steder henger sammen.", "ndla": "https://ndla.no/nb/r/geografi/globalisering-og-lokalisering-hva-kan-du-na/50721aeef6", "concepts": ["globalisering", "lokaliseringsfaktor", "global verdikjede", "arbeidsdeling", "infrastruktur", "multinasjonalt selskap", "outsourcing", "målkonflikt"], "goals": ["Forklare hvordan råvarer, energi, arbeidskraft, marked og infrastruktur påvirker lokalisering.", "Bruke en vare eller virksomhet til å vise forbindelser mellom steder.", "Drøfte hvordan globalisering påvirker natur, ressursbruk og levekår."], "tasks": [{"id": "globalisering-1", "title": "Hvor skal fabrikken ligge?", "prompt": "Velg en type virksomhet, for eksempel et aluminiumsverk, en matprodusent eller et datasenter. Forklar hvilke lokaliseringsfaktorer som er viktige, og drøft konsekvensene av å etablere virksomheten i et bestemt område i Norge.", "focus": ["Råvarer, energi og vann", "Transport, kompetanse og marked", "Naturinngrep og arealbehov", "Arbeidsplasser og lokal verdiskaping", "Ulike interesser og mulige alternativer"], "questions": [{"q": "Hva mener vi med en lokaliseringsfaktor?", "cue": "Et forhold som gjør et sted mer eller mindre egnet for en aktivitet.", "level": "Forklare"}, {"q": "Hvorfor er ikke de samme faktorene viktigst for alle typer virksomheter?", "cue": "Vekt på energi, råvarer, kunder, transport og kompetanse varierer.", "level": "Forklare"}, {"q": "Hvilke tre forhold ville du undersøkt først på stedet du valgte?", "cue": "Knytt valget til virksomhetens behov; bruk kart og dokumenterbare opplysninger.", "level": "Anvende"}, {"q": "Hvordan kan etableringen være positiv for noen og negativ for andre?", "cue": "Arbeidsplasser, inntekter, energibruk, areal, natur og eksisterende næringer.", "level": "Drøfte"}, {"q": "Bør arbeidsplasser veie tyngst når plasseringen bestemmes?", "cue": "Vurder langsiktige virkninger, alternativer, fordeling og miljømessige og sosiale hensyn.", "level": "Drøfte"}], "bridge": {"q": "Hvordan kan plasseringen gi konflikt med reindrift eller annen eksisterende arealbruk?", "cue": "Sammenhengende arealer, infrastruktur, rettigheter og samlet belastning."}}, {"id": "globalisering-2", "title": "Én vare, mange steder", "prompt": "Velg et klesplagg eller en elektronisk vare og tegn en mulig global verdikjede. Forklar hvorfor ulike ledd er lokalisert på ulike steder, og drøft hvordan verdier og belastninger kan bli fordelt.", "focus": ["Råvareuttak, produksjon, transport og salg", "Fysiske og kunnskapsbaserte ledd", "Arbeidsdeling og lokaliseringsfaktorer", "Arbeidsvilkår, verdiskaping og miljø", "Kildegrunnlag for den valgte varen"], "questions": [{"q": "Hva er en global verdikjede?", "cue": "Sammenhengende aktiviteter på flere steder som bidrar til verdien i en vare eller tjeneste.", "level": "Forklare"}, {"q": "Hva kan et selskap ønske å oppnå med outsourcing?", "cue": "Kostnader, spesialisering, fleksibilitet eller tilgang til kompetanse; virkninger varierer.", "level": "Forklare"}, {"q": "Hvilke deler av verdikjeden din har du dokumentert, og hvilke er foreløpige antakelser?", "cue": "Skill kjent opprinnelse fra generelle eksempler; vis til produsent- og uavhengige kilder.", "level": "Anvende"}, {"q": "Får alle stedene i kjeden like stor del av verdiskapingen?", "cue": "Eierskap, kompetanse, merkevare, markedsmakt og arbeidsvilkår.", "level": "Drøfte"}, {"q": "Hvordan kan krav fra kunder eller myndigheter endre kjeden?", "cue": "Sporbarhet, produktkrav, arbeidsvilkår, pris og mulige virkninger for små produsenter.", "level": "Drøfte"}], "bridge": {"q": "Hvordan kan lengre levetid for varen påvirke ressursbruk og arbeidsplasser?", "cue": "Mindre nyproduksjon, mer reparasjon og endret etterspørsel; vurder flere steder i kjeden."}}, {"id": "globalisering-3", "title": "Globalt samarbeid og lokal sårbarhet", "prompt": "Undersøk hvordan et lokalsamfunn er knyttet til andre deler av verden gjennom handel eller produksjon. Drøft fordeler og sårbarhet ved forbindelsene, og vurder tiltak som kan gjøre samfunnet mer robust.", "focus": ["Import, eksport og forbindelser mellom steder", "Arbeidsplasser, inntekter og tilgang til varer", "Avhengighet av leverandører og transport", "Miljøbelastning gjennom verdikjeden", "Avveininger mellom effektivitet og beredskap"], "questions": [{"q": "Hvordan merker et lokalsamfunn globalisering i hverdagen?", "cue": "Varer, arbeidsplasser, teknologi, investeringer og transportforbindelser.", "level": "Forklare"}, {"q": "Hva gjør en forsyningskjede sårbar?", "cue": "Få leverandører, avhengighet av bestemte ruter, energiforsyning og lite lager.", "level": "Forklare"}, {"q": "Velg én viktig vare eller næring i lokalsamfunnet ditt: Hvor kan forbindelsen brytes?", "cue": "Tegn leddene og pek ut en konkret avhengighet med dokumentasjon.", "level": "Anvende"}, {"q": "Vil mer lokal produksjon alltid være mer bærekraftig?", "cue": "Vurder produksjonsmåte, energi, transportform, ressursgrunnlag og sosiale virkninger.", "level": "Drøfte"}, {"q": "Hva kan være fordeler og kostnader ved å spre produksjonen på flere steder?", "cue": "Beredskap, pris, effektivitet, kompetanse og bruk av naturressurser.", "level": "Drøfte"}], "bridge": {"q": "Hvordan kan en naturkatastrofe få virkninger langt utenfor området som rammes?", "cue": "Transport, råvarer, produksjonsstans, priser og andre ledd i verdikjeden."}}], "cards": [{"id": "globalisering-kort-01", "term": "Globalisering", "prompt": "Hva betyr globalisering i geografifaget?", "answer": "Globalisering beskriver at steder og samfunn blir tettere knyttet sammen gjennom blant annet handel, produksjon, informasjon og flytting. Endringer ett sted kan dermed få konsekvenser langt unna.", "example": "En telefon solgt i Norge kan inneholde råvarer og komponenter fra flere verdensdeler."}, {"id": "globalisering-kort-02", "term": "Lokaliseringsfaktor", "prompt": "Hva er en lokaliseringsfaktor?", "answer": "En lokaliseringsfaktor er et forhold som påvirker hvor en aktivitet eller virksomhet plasseres. Råvarer, energi, arbeidskraft, marked, transport, areal og politiske rammer kan ha ulik betydning for ulike virksomheter.", "example": "Et bakeri kan ønske nærhet til kundene, mens et kraftkrevende verk er særlig avhengig av energitilgang."}, {"id": "globalisering-kort-03", "term": "Global verdikjede", "prompt": "Hva omfatter en global verdikjede?", "answer": "En global verdikjede består av aktiviteter på flere steder som bidrar til en vares eller tjenestes verdi. Den omfatter både fysiske ledd, som råvareuttak og produksjon, og kunnskapsbaserte ledd, som design og markedsføring.", "example": "Et klesmerke kan designe en jakke i ett land, sy den i et annet og selge den i mange land."}, {"id": "globalisering-kort-04", "term": "Arbeidsdeling", "prompt": "Hva betyr geografisk arbeidsdeling?", "answer": "Geografisk arbeidsdeling innebærer at ulike steder spesialiserer seg på ulike aktiviteter eller deler av produksjonen. Stedene blir avhengige av utveksling, og inntekter, kompetanse og belastninger kan bli ulikt fordelt.", "example": "Én region kan levere råvarer, en annen produsere komponenter og en tredje utvikle programvaren til et produkt."}, {"id": "globalisering-kort-05", "term": "Infrastruktur", "prompt": "Hvorfor er infrastruktur viktig for lokalisering?", "answer": "Infrastruktur er grunnleggende anlegg og systemer som
